<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account - Store</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo"><img src="/logo.png" alt="Store" class="nav-logo"></div>
      <h1 class="login-title">Create account</h1>
      <p class="login-subtitle">Sign up to shop</p>
      <p class="login-store-link"><a href="/store/login.html">Already have an account? Sign in</a></p>
      <form id="registerForm" class="login-form">
        <div class="login-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" placeholder="Your name">
        </div>
        <div class="login-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
        </div>
        <div id="registerError" class="login-error" style="display:none"></div>
        <button type="submit" class="login-btn" id="registerBtn">Create account</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById("registerForm");
    const errorEl = document.getElementById("registerError");
    const btn = document.getElementById("registerBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      errorEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Creating…";

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value.trim() || undefined,
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
          credentials: "include",
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.message || "Registration failed.");
        }

        window.location.href = "/store/";
      } catch (err) {
        errorEl.textContent = err.message || "Registration failed. Please try again.";
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Create account";
      }
    });
  </script>
</body>
</html>
