<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password - __STORE_NAME__</title>
  <link rel="stylesheet" href="/styles.css">
  <script>var _b="__STORE_BASE__",_s="__STORE_SLUG__";if(!_b||_b.indexOf("__")===0){var m=location.pathname.match(/^\/store\/([^/]+)/);window.STORE_BASE=m?"/store/"+m[1]:"/store";window.STORE_SLUG=m?m[1]:null;}else{window.STORE_BASE=_b;window.STORE_SLUG=_s;}</script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo"><img src="__STORE_LOGO__" alt="__STORE_NAME__" class="nav-logo"></div>
      <h1 class="login-title">__STORE_NAME__</h1>
      <p class="login-subtitle">Enter your email to receive a reset link</p>
      <p class="login-store-link"><a href="__STORE_BASE__/login">← Back to sign in</a></p>
      <form id="forgotForm" class="login-form">
        <div class="login-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div id="forgotError" class="login-error" style="display:none"></div>
        <div id="forgotSuccess" class="login-success" style="display:none"></div>
        <button type="submit" class="login-btn" id="forgotBtn">Send reset link</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const errorEl = document.getElementById("forgotError");
    const successEl = document.getElementById("forgotSuccess");
    const btn = document.getElementById("forgotBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      successEl.style.display = "none";
      errorEl.textContent = "";
      successEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Sending…";

      const payload = { email: emailInput.value.trim() };
      if (window.STORE_SLUG) payload.storeSlug = window.STORE_SLUG;

      try {
        const res = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          credentials: "include",
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.message || "Request failed. Please try again.");
        }

        successEl.textContent = data.message || "If an account exists, you'll receive a reset link by email.";
        successEl.style.display = "block";
        btn.textContent = "Send reset link";
      } catch (err) {
        errorEl.textContent = err.message || "Something went wrong.";
        errorEl.style.display = "block";
        btn.textContent = "Send reset link";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
