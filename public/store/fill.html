<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customize - Store</title>
  <link rel="stylesheet" href="/styles.css">
  <script>var _b="__STORE_BASE__",_s="__STORE_SLUG__";if(!_b||_b.indexOf("__")===0){var m=location.pathname.match(/^\/store\/([^/]+)/);window.STORE_BASE=m?"/store/"+m[1]:"/store";window.STORE_SLUG=m?m[1]:null;}else{window.STORE_BASE=_b;window.STORE_SLUG=_s;}window.STORE_CART_KEY=window.STORE_SLUG?"storeCart_"+window.STORE_SLUG:"storeCart";</script>
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple store-nav">
      <a href="__STORE_BASE__/products" class="top-nav-back" id="fillBackLink">← Back to products</a>
      <a href="__STORE_BASE__/" class="top-nav-brand nav-logo-wrap"><img src="__STORE_LOGO__" alt="Store" class="nav-logo"></a>
      <div class="store-nav-right">
        <a href="__STORE_BASE__/cart" class="store-cart-link">Cart (<span id="cartCount">0</span>)</a>
        <a href="__STORE_BASE__/orders" class="store-orders-link">My Orders</a>
        <a href="__STORE_BASE__/settings" class="store-settings-link" title="Settings">⚙ Settings</a>
        <a href="#" id="fillLogout" class="top-nav-back">Log out</a>
      </div>
    </header>
    <main class="main-content store-fill-main">
      <div id="fillLoading" class="loading">Loading…</div>
      <div id="fillError" class="store-fill-error" style="display:none"></div>
      <div id="fillContent" class="store-fill-content" style="display:none">
        <h1 id="fillTitle" class="store-fill-title"></h1>
        <div class="store-fill-layout">
          <div class="store-fill-form-section">
            <div class="pod-num-cards-row">
              <label>Number of designs</label>
              <div class="pod-num-cards-options">
                <label class="pod-num-option"><input type="radio" name="podNumCards" value="1" checked> 1 design</label>
                <label class="pod-num-option"><input type="radio" name="podNumCards" value="2"> 2 designs</label>
                <label class="pod-num-option"><input type="radio" name="podNumCards" value="4"> 4 designs</label>
              </div>
            </div>
            <div class="pod-qty-row" id="podQtyRow">
              <label>Quantity per design</label>
              <select id="podQtyPerDesign" class="pod-qty-select">
                <option value="100">100</option>
                <option value="150">150</option>
                <option value="250" selected>250</option>
              </select>
            </div>
            <div class="pod-forms-wrap" id="podFormsWrap"></div>
            <div class="store-fill-actions">
              <button type="button" class="btn-apply" id="podAddToCartBtn">Add to cart</button>
              <a href="__STORE_BASE__/products" class="btn-secondary" id="fillCancelBtn">Cancel</a>
            </div>
          </div>
          <div class="store-fill-preview-section">
            <div class="pod-proof-wrap">
              <div class="pod-proof-label">Live preview</div>
              <div id="podProofCardTabs" class="pod-proof-tabs" style="display:none"></div>
              <p class="pod-proof-hint">Shows your filled design. Updates as you type.</p>
              <div id="podProof" class="pod-proof"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const productId = params.get("product");
      const base = window.STORE_BASE || "/store";

      function escape(s) {
        const d = document.createElement("div");
        d.textContent = s ?? "";
        return d.innerHTML;
      }

      function formatPhoneInputUS(value) {
        const digits = (value || "").replace(/\D/g, "").slice(0, 10);
        if (!digits.length) return "";
        if (digits.length <= 3) return "(" + digits;
        if (digits.length <= 6) return "(" + digits.slice(0, 3) + ") " + digits.slice(3);
        return "(" + digits.slice(0, 3) + ") " + digits.slice(3, 6) + "-" + digits.slice(6);
      }

      /** Mexico: 10-digit NSN after optional country code 52 → +52 XX XXXX XXXX */
      function formatPhoneInputMX(value) {
        let d = (value || "").replace(/\D/g, "");
        if (d.startsWith("52") && d.length >= 12) d = d.slice(2);
        d = d.slice(0, 10);
        if (!d.length) return "";
        if (d.length <= 2) return "+52 " + d;
        if (d.length <= 6) return "+52 " + d.slice(0, 2) + " " + d.slice(2);
        return "+52 " + d.slice(0, 2) + " " + d.slice(2, 6) + " " + d.slice(6);
      }

      function formatPhoneInputByConfig(value, phoneFormat) {
        const fmt = (phoneFormat || "us").toLowerCase();
        if (fmt === "mx" || fmt === "mexico") return formatPhoneInputMX(value);
        return formatPhoneInputUS(value);
      }

      function getCart() {
        try {
          return JSON.parse(localStorage.getItem(window.STORE_CART_KEY || "storeCart") || "[]");
        } catch { return []; }
      }

      function setCart(cart) {
        localStorage.setItem(window.STORE_CART_KEY || "storeCart", JSON.stringify(cart));
        const el = document.getElementById("cartCount");
        if (el) el.textContent = cart.reduce((s, i) => s + (i.quantity || 1), 0);
      }

      function isImageFile(filename) {
        return [".jpg", ".jpeg", ".png", ".gif", ".webp"].some((e) => (filename || "").toLowerCase().endsWith(e));
      }

      function getFirstImageFile(files) {
        return (files || []).find((f) => isImageFile(f.filename));
      }

      function getFirstFile(files) {
        return (files || [])[0];
      }

      function getImageUrl(file) {
        if (!file) return "";
        if (typeof file === "object" && file.url) {
          const u = file.url;
          if (u && (u.startsWith("http://") || u.startsWith("https://"))) return u;
          return u || "";
        }
        const p = typeof file === "string" ? file : file?.path;
        if (!p) return "";
        if (p.startsWith("http://") || p.startsWith("https://")) return p;
        return p ? "/uploads/" + p.split("/").map(encodeURIComponent).join("/") : "";
      }

      function getPODConfig(product) {
        let config = { layout: "business_card", fields: [] };
        try {
          const raw = product.printTemplateConfig;
          if (raw && typeof raw === "string") config = JSON.parse(raw);
          else if (raw && typeof raw === "object") config = raw;
        } catch (_) {}
        if (!config.fields || !Array.isArray(config.fields) || config.fields.length === 0) {
          config.fields = [{ key: "name", label: "Full Name", type: "text" }];
        } else {
          const phoneIdx = config.fields.findIndex((f) => (f.key || "").toLowerCase() === "phone");
          if (phoneIdx >= 0 && !config.fields.some((f) => (f.key || "").toLowerCase() === "phonep")) {
            config.fields[phoneIdx] = { key: "phoneP", label: "P", type: "text" };
            config.fields.splice(phoneIdx + 1, 0, { key: "phoneM", label: "M", type: "text" });
          }
        }
        if (!config.phoneFormat) config.phoneFormat = "us";
        return config;
      }

      function slashToNewline(s) {
        return (s || "").replace(/ \/ /g, "\n").replace(/\//g, "\n");
      }

      function getPODFormValuesForCard(config, cardIdx) {
        const values = {};
        (config.fields || []).forEach((f) => {
          const key = f.key || "field";
          const el = document.getElementById("pod-" + cardIdx + "-" + key);
          if (!el) { values[key] = ""; return; }
          if (el.tagName === "SELECT") {
            const raw = el.multiple ? Array.from(el.selectedOptions).map((o) => o.value).join("\n") : el.value;
            values[key] = slashToNewline(raw);
          } else {
            values[key] = el.value.trim();
          }
        });
        return values;
      }

      function getPODFormValues(config) {
        return getPODFormValuesForCard(config, 0);
      }

      function parseAllowedQuantities(val) {
        if (!val) return null;
        try {
          const arr = typeof val === "string" && val.startsWith("[") ? JSON.parse(val) : val;
          return Array.isArray(arr) && arr.length ? arr.map((n) => parseInt(n, 10)).filter((n) => !isNaN(n) && n > 0) : null;
        } catch (_) {
          return null;
        }
      }

      function getQtyDropdownOptions(minQty, maxQty) {
        const min = minQty != null ? Math.max(1, minQty) : 1;
        const max = maxQty != null ? Math.max(min, maxQty) : 1000;
        if (max - min <= 50) {
          return Array.from({ length: max - min + 1 }, (_, i) => min + i);
        }
        const steps = [1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
        const opts = [...new Set(steps.filter((s) => s >= min && s <= max).concat(min, max))].sort((a, b) => a - b);
        return opts.length ? opts : [min];
      }

      function validatePODRequired(config, values) {
        for (const f of config.fields || []) {
          if (!f.required) continue;
          const v = values[f.key];
          if (v == null || String(v).trim() === "") {
            return { ok: false, message: "Please fill or choose " + (f.label || f.key) + "." };
          }
        }
        return { ok: true };
      }

      /** Prefill POD fields from saved cart printData (single card index). */
      function applyPrintDataToFields(config, printData, cardIdx) {
        const pd = printData || {};
        (config.fields || []).forEach((f) => {
          const key = f.key || "field";
          const el = document.getElementById("pod-" + cardIdx + "-" + key);
          if (!el) return;
          let v = pd[key];
          if (v == null) v = "";
          if (el.tagName === "SELECT") {
            if (el.multiple) {
              const parts = String(v).split(/\n/).map((s) => s.trim()).filter(Boolean);
              Array.from(el.options).forEach((o) => { o.selected = parts.includes(o.value); });
            } else {
              el.value = String(v);
            }
          } else if (el.type === "tel" || (key || "").toLowerCase().includes("phone")) {
            el.value = formatPhoneInputByConfig(String(v), config.phoneFormat);
          } else {
            el.value = String(v);
          }
        });
      }

      let podProofBlobUrl = null;
      let podProofDebounceTimer = null;
      const POD_PREVIEW_DEBOUNCE_MS = 500;

      function revokePodProofUrl() {
        if (podProofBlobUrl) {
          URL.revokeObjectURL(podProofBlobUrl);
          podProofBlobUrl = null;
        }
      }

      async function fetchPODPreviewAndShow(values) {
        const proof = document.getElementById("podProof");
        const container = proof?.querySelector(".pod-proof-pdf-container");
        if (!container) return;
        container.innerHTML = "<div class=\"pod-proof-loading\">Loading preview…</div>";
        try {
          const res = await fetch("/api/pod/preview", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(values),
          });
          if (!res.ok) throw new Error("Preview unavailable");
          const blob = await res.blob();
          revokePodProofUrl();
          podProofBlobUrl = URL.createObjectURL(blob);
          container.innerHTML = "<iframe class=\"pod-proof-iframe\" src=\"" + podProofBlobUrl.replace(/"/g, "&quot;") + "\" title=\"Print preview\"></iframe>";
        } catch (e) {
          container.innerHTML = "<div class=\"pod-proof-error\">" + escape(e.message || "Preview unavailable.") + "</div>";
        }
      }

      function updatePODProof(config, values) {
        const proof = document.getElementById("podProof");
        if (!proof) return;
        const layout = (config.layout || "business_card").toLowerCase();
        proof.className = "pod-proof pod-proof-" + layout;
        if (layout === "business_card") {
          if (!proof.querySelector(".pod-proof-pdf-container")) {
            proof.innerHTML = "<div class=\"pod-proof-pdf-container\"><div class=\"pod-proof-loading\">Loading preview…</div></div>";
          }
          clearTimeout(podProofDebounceTimer);
          podProofDebounceTimer = setTimeout(() => fetchPODPreviewAndShow(values), POD_PREVIEW_DEBOUNCE_MS);
        } else {
          revokePodProofUrl();
          proof.innerHTML = (config.fields || [])
            .map((f) => "<div class=\"pod-proof-line\"><strong>" + escape(f.label) + "</strong> " + escape(values[f.key] || "") + "</div>")
            .join("");
        }
      }

      function updatePODProofFromCard(config, cardIdx, numCards) {
        const values = getPODFormValuesForCard(config, cardIdx);
        updatePODProof(config, values);
      }

      let currentPreviewCardIdx = 0;

      function buildFormSection(product, config, cardIdx, numCards) {
        const fields = config.fields || [];
        function normOpt(opt) {
          const val = typeof opt === "object" && opt != null && "value" in opt ? opt.value : opt;
          const lbl = typeof opt === "object" && opt != null && "label" in opt ? opt.label : val;
          const desc = typeof opt === "object" && opt != null && "description" in opt ? opt.description : "";
          return { value: val, label: lbl, description: desc };
        }
        function updateDescForSelect(sel, descEl) {
          const selOpt = sel.multiple ? Array.from(sel.selectedOptions)[0] : sel.options[sel.selectedIndex];
          descEl.textContent = selOpt && selOpt.dataset.description ? selOpt.dataset.description : "";
        }
        const section = document.createElement("div");
        section.className = "pod-card-section";
        section.dataset.cardIdx = cardIdx;
        const heading = document.createElement("h3");
        heading.className = "pod-card-section-title";
        heading.textContent = "Card " + (cardIdx + 1);
        section.appendChild(heading);
        for (let idx = 0; idx < fields.length; idx++) {
          const f = fields[idx];
          const key = f.key || "field";
          const nextF = fields[idx + 1];
          const isPhoneRow = key === "phoneP" && nextF && (nextF.key || "") === "phoneM";
          const fieldId = "pod-" + cardIdx + "-" + key;
          const phoneFmt = (config.phoneFormat || "us").toLowerCase();
          const isMxPhone = phoneFmt === "mx" || phoneFmt === "mexico";
          if (isPhoneRow) {
            const row = document.createElement("div");
            row.className = "pod-form-row-inline";
            ["phoneP", "phoneM"].forEach((k, i) => {
              const kid = "pod-" + cardIdx + "-" + k;
              const lab = document.createElement("label");
              lab.textContent = i === 0 ? "P" : "M";
              lab.setAttribute("for", kid);
              const inp = document.createElement("input");
              inp.type = "tel";
              inp.id = kid;
              inp.name = k;
              inp.placeholder = isMxPhone ? "+52 55 8107 3614" : "(555) 123-4567";
              inp.className = "pod-input pod-input-phone";
              inp.maxLength = isMxPhone ? 20 : 14;
              inp.inputMode = isMxPhone ? "numeric" : "numeric";
              const cb = () => {
                inp.value = formatPhoneInputByConfig(inp.value, config.phoneFormat);
                inp.setSelectionRange(inp.value.length, inp.value.length);
                if (currentPreviewCardIdx === cardIdx) updatePODProofFromCard(config, cardIdx, numCards);
              };
              inp.addEventListener("input", cb);
              row.appendChild(lab);
              row.appendChild(inp);
            });
            section.appendChild(row);
            idx++;
            continue;
          }
          const isTextarea = (f.type || "text") === "textarea";
          const isMultiselect = (f.type || "") === "multiselect";
          const isSelect = (f.type || "") === "select" || (isMultiselect && Array.isArray(f.options) && f.options.length > 0);
          const hasOptions = Array.isArray(f.options) && f.options.length > 0;
          const label = document.createElement("label");
          label.textContent = (f.label || key) + (f.required ? " *" : "");
          label.setAttribute("for", fieldId);
          const cb = () => { if (currentPreviewCardIdx === cardIdx) updatePODProofFromCard(config, cardIdx, numCards); };
          if (isMultiselect && hasOptions) {
            const wrap = document.createElement("div");
            wrap.className = "pod-field-select-wrap";
            const select = document.createElement("select");
            select.id = fieldId;
            select.name = key;
            select.className = "pod-input pod-select pod-select-multiple";
            select.multiple = true;
            if (f.required) select.required = true;
            (f.options || []).forEach((opt) => {
              const { value: val, label: lbl, description: desc } = normOpt(opt);
              const o = document.createElement("option");
              o.value = val;
              o.textContent = lbl;
              if (desc) o.dataset.description = desc;
              select.appendChild(o);
            });
            const descEl = document.createElement("div");
            descEl.className = "pod-field-option-desc";
            select.addEventListener("change", () => { updateDescForSelect(select, descEl); cb(); });
            wrap.appendChild(label);
            wrap.appendChild(select);
            wrap.appendChild(descEl);
            section.appendChild(wrap);
          } else if (isSelect && hasOptions) {
            const wrap = document.createElement("div");
            wrap.className = "pod-field-select-wrap";
            const select = document.createElement("select");
            select.id = fieldId;
            select.name = key;
            select.className = "pod-input pod-select";
            if (f.required) select.required = true;
            const opt0 = document.createElement("option");
            opt0.value = "";
            opt0.textContent = "Choose one...";
            select.appendChild(opt0);
            (f.options || []).forEach((opt) => {
              const { value: val, label: lbl, description: desc } = normOpt(opt);
              const o = document.createElement("option");
              o.value = val;
              o.textContent = lbl;
              if (desc) o.dataset.description = desc;
              select.appendChild(o);
            });
            const descEl = document.createElement("div");
            descEl.className = "pod-field-option-desc";
            select.addEventListener("change", () => { updateDescForSelect(select, descEl); cb(); });
            wrap.appendChild(label);
            wrap.appendChild(select);
            wrap.appendChild(descEl);
            section.appendChild(wrap);
          } else if (isTextarea) {
            const ta = document.createElement("textarea");
            ta.id = fieldId;
            ta.name = key;
            ta.placeholder = f.label || key;
            ta.className = "pod-input pod-textarea";
            ta.rows = 3;
            if (f.required) ta.required = true;
            ta.addEventListener("input", cb);
            section.appendChild(label);
            section.appendChild(ta);
          } else {
            const input = document.createElement("input");
            input.type = "text";
            input.id = fieldId;
            input.name = key;
            input.placeholder = f.label || key;
            input.className = "pod-input";
            if (f.required) input.required = true;
            input.addEventListener("input", cb);
            section.appendChild(label);
            section.appendChild(input);
          }
        }
        return section;
      }

      function buildForms(product, config, numCards) {
        const formWrap = document.getElementById("podFormsWrap");
        formWrap.innerHTML = "";
        for (let i = 0; i < numCards; i++) {
          formWrap.appendChild(buildFormSection(product, config, i, numCards));
        }
        const layout = (config.layout || "business_card").toLowerCase();
        if (layout === "business_card") {
          updatePODProofFromCard(config, 0, numCards);
        }
      }

      function buildForm(product, config) {
        buildForms(product, config, 1);
      }

      async function load() {
        if (!productId) {
          document.getElementById("fillLoading").style.display = "none";
          document.getElementById("fillError").style.display = "block";
          document.getElementById("fillError").textContent = "No product specified. Use the products page and click Customize & Add.";
          return;
        }

        try {
          const url = "/api/products/" + productId + (window.STORE_SLUG ? "?deployment=" + encodeURIComponent(window.STORE_SLUG) : "");
          const res = await fetch(url, { credentials: "include" });
          if (!res.ok) {
            if (res.status === 401) {
              window.location.href = base + "/login";
              return;
            }
            throw new Error(res.status === 404 ? "Product not found" : "Failed to load");
          }
          const product = await res.json();

          if (!product.isPrintOnDemand || !product.printTemplateConfig) {
            document.getElementById("fillLoading").style.display = "none";
            document.getElementById("fillError").style.display = "block";
            document.getElementById("fillError").textContent = "This product is not customizable. Go back to products.";
            return;
          }

          document.getElementById("fillLoading").style.display = "none";
          document.getElementById("fillContent").style.display = "block";
          document.getElementById("fillTitle").textContent = "Customize: " + (product.name || "Print");

          const config = getPODConfig(product);
          let editingCartIndex = null;
          const ecParam = params.get("editCart");
          if (ecParam != null && ecParam !== "") {
            const idx = parseInt(ecParam, 10);
            const cartProbe = getCart();
            if (!isNaN(idx) && idx >= 0 && idx < cartProbe.length) {
              const it = cartProbe[idx];
              if (Number(it.productId) === Number(productId) && it.printData && Object.keys(it.printData).length) {
                editingCartIndex = idx;
              }
            }
          }

          function getNumCards() {
            const r = document.querySelector("input[name=podNumCards]:checked");
            return Math.max(1, parseInt(r?.value, 10) || 1);
          }

          function syncProofTabs(numCards) {
            const tabs = document.getElementById("podProofCardTabs");
            if (numCards <= 1) {
              tabs.style.display = "none";
              tabs.innerHTML = "";
              return;
            }
            tabs.style.display = "flex";
            tabs.innerHTML = "";
            for (let i = 0; i < numCards; i++) {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "pod-proof-tab" + (i === currentPreviewCardIdx ? " active" : "");
              btn.textContent = "Card " + (i + 1);
              btn.dataset.cardIdx = String(i);
              btn.addEventListener("click", () => {
                currentPreviewCardIdx = i;
                tabs.querySelectorAll(".pod-proof-tab").forEach((t) => t.classList.remove("active"));
                btn.classList.add("active");
                updatePODProofFromCard(config, i, numCards);
              });
              tabs.appendChild(btn);
            }
          }

          function rebuildForms() {
            const numCards = getNumCards();
            buildForms(product, config, numCards);
            syncProofTabs(numCards);
          }

          function getQtyPerDesign() {
            return Math.max(100, parseInt(document.getElementById("podQtyPerDesign")?.value, 10) || 250);
          }

          function getPriceFromMatrix(matrix, qtyPerDesign, numDesigns) {
            if (!matrix || typeof matrix !== "object") return null;
            const row = matrix[String(qtyPerDesign)];
            if (!row || typeof row !== "object") return null;
            const total = row[String(numDesigns)];
            if (total == null || typeof total !== "number") return null;
            const totalCards = qtyPerDesign * numDesigns;
            return totalCards > 0 ? total / totalCards : null;
          }

          function syncQtyOptions() {
            const sel = document.getElementById("podQtyPerDesign");
            if (!sel) return;
            let options = [100, 150, 250];
            try {
              const raw = product.pricingMatrix;
              const mx = typeof raw === "string" ? JSON.parse(raw) : raw;
              if (mx && typeof mx === "object") {
                const keys = Object.keys(mx).map((k) => parseInt(k, 10)).filter((n) => !isNaN(n) && n > 0);
                if (keys.length) options = keys.sort((a, b) => a - b);
              }
            } catch (_) {}
            const allowed = parseAllowedQuantities(product.allowedQuantities);
            if (allowed && allowed.length) options = allowed;
            sel.innerHTML = options.map((q) => "<option value=\"" + q + "\">" + q + "</option>").join("");
            if (!options.includes(250)) sel.value = options[0];
          }

          syncQtyOptions();

          if (editingCartIndex !== null) {
            const editItem = getCart()[editingCartIndex];
            document.getElementById("fillTitle").textContent = "Edit: " + (product.name || "Print");
            document.getElementById("podAddToCartBtn").textContent = "Update cart";
            const r1 = document.querySelector("input[name=podNumCards][value=\"1\"]");
            if (r1) r1.checked = true;
            const numRow = document.querySelector(".pod-num-cards-row");
            if (numRow) numRow.style.display = "none";
            document.getElementById("fillBackLink").href = base + "/cart";
            document.getElementById("fillCancelBtn").href = base + "/cart";
            const qsel = document.getElementById("podQtyPerDesign");
            if (qsel && editItem.quantity) {
              const qv = Number(editItem.quantity);
              if ([...qsel.options].some((o) => Number(o.value) === qv)) qsel.value = String(qv);
            }
            rebuildForms();
            applyPrintDataToFields(config, editItem.printData, 0);
            syncProofTabs(1);
            updatePODProofFromCard(config, 0, 1);
          } else {
            document.getElementById("fillBackLink").href = base + "/products";
            document.getElementById("fillCancelBtn").href = base + "/products";
            rebuildForms();
          }

          document.querySelectorAll("input[name=podNumCards]").forEach((r) => {
            r.addEventListener("change", rebuildForms);
          });

          document.getElementById("podAddToCartBtn").addEventListener("click", () => {
            const numCards = getNumCards();
            const qtyPerDesign = getQtyPerDesign();
            const matrix = (function() {
              try {
                const r = product.pricingMatrix;
                return typeof r === "string" ? JSON.parse(r) : r;
              } catch (_) { return null; }
            })();
            const unitPrice = getPriceFromMatrix(matrix, qtyPerDesign, numCards) ?? product.price;
            const imageFile = getFirstImageFile(product.files);
            const pdfFile = getFirstFile(product.files);
            const previewBase = "/api/products/" + product.id + "/preview" + (window.STORE_SLUG ? "?deployment=" + encodeURIComponent(window.STORE_SLUG) : "");
            const imgUrl = (product.imageUrl && (product.imageUrl.startsWith("http://") || product.imageUrl.startsWith("https://")))
              ? product.imageUrl
              : imageFile ? getImageUrl(imageFile) : pdfFile ? previewBase : null;
            const cart = getCart();
            const available = product.quantity ?? 0;

            if (editingCartIndex !== null) {
              const printData = getPODFormValuesForCard(config, 0);
              const validation = validatePODRequired(config, printData);
              if (!validation.ok) {
                alert(validation.message);
                return;
              }
              if (editingCartIndex < 0 || editingCartIndex >= cart.length) {
                alert("This cart line is no longer available. Return to the cart.");
                return;
              }
              const cartItem = cart[editingCartIndex];
              if (Number(cartItem.productId) !== Number(product.id)) {
                alert("Product mismatch. Open the cart and try again.");
                return;
              }
              const qtyOther = cart.reduce((s, it, j) => (j === editingCartIndex ? s : (it.productId === product.id ? s + (it.quantity || 1) : s)), 0);
              if (qtyOther + qtyPerDesign > available) {
                alert("Out of stock. Only " + available + " available.");
                return;
              }
              const old = cart[editingCartIndex];
              const newLine = {
                ...old,
                quantity: qtyPerDesign,
                printData: printData,
                price: unitPrice,
                pricingMatrix: product.pricingMatrix || old.pricingMatrix,
              };
              if (product.rushFee != null && Number(product.rushFee) > 0) {
                newLine.rushFee = Number(product.rushFee);
                if (typeof old.rushSelected === "boolean") newLine.rushSelected = old.rushSelected;
              } else {
                delete newLine.rushFee;
                delete newLine.rushSelected;
              }
              const newCart = cart.slice();
              newCart[editingCartIndex] = newLine;
              setCart(newCart);
              window.location.href = base + "/cart";
              return;
            }

            for (let i = 0; i < numCards; i++) {
              const printData = getPODFormValuesForCard(config, i);
              const validation = validatePODRequired(config, printData);
              if (!validation.ok) {
                alert("Design " + (i + 1) + ": " + validation.message);
                return;
              }
              const requested = cart.filter((it) => it.productId === product.id && JSON.stringify(it.printData || {}) === JSON.stringify(printData)).reduce((s, it) => s + (it.quantity || 1), 0) + qtyPerDesign;
              if (requested > available) {
                alert("Out of stock. Only " + available + " available.");
                return;
              }
              const existing = cart.find((it) => it.productId === product.id && JSON.stringify(it.printData || {}) === JSON.stringify(printData));
              if (existing) {
                existing.quantity = (existing.quantity || 1) + qtyPerDesign;
                existing.pricingMatrix = product.pricingMatrix || existing.pricingMatrix;
                if (product.rushFee != null && Number(product.rushFee) > 0) {
                  existing.rushFee = Number(product.rushFee);
                  if (typeof existing.rushSelected !== "boolean") existing.rushSelected = false;
                } else {
                  delete existing.rushFee;
                  delete existing.rushSelected;
                }
              } else {
                const qtyOpts = matrix ? Object.keys(matrix).map((k) => parseInt(k, 10)).filter((n) => !isNaN(n) && n > 0).sort((a, b) => a - b) : null;
                const row = {
                  productId: product.id,
                  sku: product.sku,
                  quantity: qtyPerDesign,
                  name: product.name,
                  price: unitPrice,
                  imageUrl: imgUrl || null,
                  printData: printData,
                  pricingMatrix: product.pricingMatrix || null,
                  allowedQuantities: qtyOpts && qtyOpts.length ? JSON.stringify(qtyOpts) : null,
                  minOrderQty: 1,
                  maxOrderQty: null,
                };
                if (product.rushFee != null && Number(product.rushFee) > 0) {
                  row.rushFee = Number(product.rushFee);
                  row.rushSelected = false;
                }
                cart.push(row);
              }
            }
            setCart(cart);
            window.location.href = base + "/cart";
          });
        } catch (e) {
          document.getElementById("fillLoading").style.display = "none";
          document.getElementById("fillError").style.display = "block";
          document.getElementById("fillError").textContent = "Error: " + (e.message || "Could not load product");
        }
      }

      document.getElementById("cartCount").textContent = getCart().reduce((s, i) => s + (i.quantity || 1), 0);

      document.getElementById("fillLogout")?.addEventListener("click", async (e) => {
        e.preventDefault();
        await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
        window.location.href = base + "/login";
      });

      load();
    })();
  </script>
</body>
</html>
