<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple store-nav">
      <a href="/store/" class="top-nav-brand nav-logo-wrap"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSIzNiIgdmlld0JveD0iMCAwIDgwIDM2Ij48cmVjdCB3aWR0aD0iODAiIGhlaWdodD0iMzYiIGZpbGw9IiNmMWY1ZjkiIHJ4PSI2Ii8+PHRleHQgeD0iNDAiIHk9IjIyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNjQ3NDhiIiBmb250LXNpemU9IjEyIiBmb250LWZhbWlseT0ic3lzdGVtLXVpLHNhbnMtc2VyaWYiPlN0b3JlPC90ZXh0Pjwvc3ZnPg==" alt="Store" class="nav-logo"></a>
      <div class="store-nav-right">
        <a href="/store/cart.html" class="store-cart-link" id="cartLink">Cart (<span id="cartCount">0</span>)</a>
        <a href="/store/orders.html" class="store-orders-link">My Orders</a>
        <a href="/store/settings.html" class="store-settings-link" title="Settings">⚙ Settings</a>
        <a href="#" id="logoutLink" class="top-nav-back">Log out</a>
      </div>
    </header>
    <main class="main-content store-bento-main">
      <h1 class="bento-title">Shop by category</h1>
      <div class="store-bento-grid" id="categoryGrid">
        <div class="loading" id="loading">Loading…</div>
      </div>
    </main>
  </div>
  <script>
    const grid = document.getElementById("categoryGrid");
    const cartCount = document.getElementById("cartCount");

    function escape(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem("storeCart") || "[]");
      } catch {
        return [];
      }
    }

    const CATEGORY_ICONS = {
      stationery: "✏️",
      office: "📎",
      supplies: "📦",
      default: "🏷️",
    };

    function getCategoryIcon(cat) {
      const key = (cat || "").toLowerCase();
      return CATEGORY_ICONS[key] || CATEGORY_ICONS.default;
    }

    async function load() {
      try {
        const [productsRes, categoriesRes] = await Promise.all([
          fetch("/api/products", { credentials: "include" }),
          fetch("/api/products/categories", { credentials: "include" }),
        ]);
        if (!productsRes.ok || !categoriesRes.ok) {
          if (productsRes.status === 401 || categoriesRes.status === 401) {
            window.location.href = "/store/login.html";
            return;
          }
          throw new Error("Failed to load");
        }
        const products = await productsRes.json();
        const categories = await categoriesRes.json();
        const regular = products.filter((p) => (p.productType || "regular") !== "kit" || !p.kitItems?.length);

        document.getElementById("loading").style.display = "none";

        let html =
          '<a href="/store/products.html" class="store-bento-card store-bento-card-large">' +
          '<span class="bento-icon">📦</span>' +
          "<h2>All products</h2>" +
          "<p>" +
          regular.length +
          " items</p>" +
          "</a>";
        for (const cat of categories) {
          const count = regular.filter((p) => (p.category || "").trim() === cat).length;
          if (count > 0) {
            html +=
              '<a href="/store/products.html?category=' +
              encodeURIComponent(cat) +
              '" class="store-bento-card">' +
              '<span class="bento-icon">' +
              getCategoryIcon(cat) +
              "</span>" +
              "<h2>" +
              escape(cat) +
              "</h2>" +
              "<p>" +
              count +
              " items</p>" +
              "</a>";
          }
        }
        grid.innerHTML = html;
      } catch (e) {
        grid.innerHTML = '<p class="store-empty error">' + escape(e.message) + "</p>";
      }
    }

    cartCount.textContent = getCart().reduce((s, i) => s + (i.quantity || 1), 0);

    document.getElementById("logoutLink").addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = "/store/login.html";
    });

    load();
  </script>
</body>
</html>
