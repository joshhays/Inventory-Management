<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
var _b="__STORE_BASE__",_s="__STORE_SLUG__";
if(!_b||_b.indexOf("__")===0){var m=location.pathname.match(/^\/store\/([^/]+)/);window.STORE_BASE=m?"/store/"+m[1]:"/store";window.STORE_SLUG=m?m[1]:null;}
else{window.STORE_BASE=_b;window.STORE_SLUG=_s;}
window.STORE_CART_KEY=window.STORE_SLUG?"storeCart_"+window.STORE_SLUG:"storeCart";
</script>
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple store-nav">
      <a href="__STORE_BASE__/" class="top-nav-brand nav-logo-wrap"><img src="__STORE_LOGO__" alt="Store" class="nav-logo"></a>
      <div class="store-nav-right">
        <a href="__STORE_BASE__/cart" class="store-cart-link" id="cartLink">Cart (<span id="cartCount">0</span>)</a>
        <a href="__STORE_BASE__/orders" class="store-orders-link">My Orders</a>
        <a href="__STORE_BASE__/approvals" class="store-approvals-link" title="Approve orders">✓ Approvals</a>
        <a href="__STORE_BASE__/settings" class="store-settings-link" title="Settings">⚙ Settings</a>
        <a href="#" id="logoutLink" class="top-nav-back">Log out</a>
      </div>
    </header>
    <main class="main-content store-bento-main">
      <h1 class="bento-title">Shop by category</h1>
      <div class="store-bento-grid" id="categoryGrid">
        <div class="loading" id="loading">Loading…</div>
      </div>
    </main>
  </div>
  <script>
    const grid = document.getElementById("categoryGrid");
    const cartCount = document.getElementById("cartCount");

    function escape(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem(window.STORE_CART_KEY || "storeCart") || "[]");
      } catch {
        return [];
      }
    }

    const CATEGORY_ICONS = {
      stationery: "✏️",
      office: "📎",
      supplies: "📦",
      default: "🏷️",
    };

    function getCategoryIcon(cat) {
      const key = (cat || "").toLowerCase();
      return CATEGORY_ICONS[key] || CATEGORY_ICONS.default;
    }

    async function load() {
      try {
        const apiSuffix = window.STORE_SLUG ? "?deployment=" + encodeURIComponent(window.STORE_SLUG) : "";
        const [productsRes, categoriesRes] = await Promise.all([
          fetch("/api/products" + apiSuffix, { credentials: "include" }),
          fetch("/api/products/categories" + apiSuffix, { credentials: "include" }),
        ]);
        if (!productsRes.ok || !categoriesRes.ok) {
          if (productsRes.status === 401 || categoriesRes.status === 401) {
            window.location.href = (window.STORE_BASE || "/store") + "/login";
            return;
          }
          throw new Error("Failed to load");
        }
        const products = await productsRes.json();
        const categories = await categoriesRes.json();
        const regular = products.filter((p) => (p.productType || "regular") !== "kit" || !p.kitItems?.length);

        document.getElementById("loading").style.display = "none";

        const base = window.STORE_BASE || "/store";
        let html =
          '<a href="' + base + '/products" class="store-bento-card store-bento-card-large">' +
          '<span class="bento-icon">📦</span>' +
          "<h2>All products</h2>" +
          "<p>" +
          regular.length +
          " items</p>" +
          "</a>";
        for (const cat of categories) {
          const count = regular.filter((p) => (p.category || "").trim() === cat).length;
          if (count > 0) {
            html +=
              '<a href="' + base + '/products?category=' +
              encodeURIComponent(cat) +
              '" class="store-bento-card">' +
              '<span class="bento-icon">' +
              getCategoryIcon(cat) +
              "</span>" +
              "<h2>" +
              escape(cat) +
              "</h2>" +
              "<p>" +
              count +
              " items</p>" +
              "</a>";
          }
        }
        grid.innerHTML = html;
      } catch (e) {
        grid.innerHTML = '<p class="store-empty error">' + escape(e.message) + "</p>";
      }
    }

    cartCount.textContent = getCart().reduce((s, i) => s + (i.quantity || 1), 0);

    document.getElementById("logoutLink").addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = (window.STORE_BASE || "/store") + "/login";
    });

    load();
  </script>
</body>
</html>
