<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Store</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple store-nav">
      <a href="/store/" class="top-nav-back">← Categories</a>
      <a href="/store/" class="top-nav-brand nav-logo-wrap"><img src="/logo.png" alt="Store" class="nav-logo"></a>
      <span class="top-nav-brand" id="pageTitle">Products</span>
      <div class="store-nav-right">
        <a href="/store/cart.html" class="store-cart-link">Cart (<span id="cartCount">0</span>)</a>
        <a href="/store/orders.html" class="store-orders-link">My Orders</a>
        <a href="/store/settings.html" class="store-settings-link" title="Settings">⚙ Settings</a>
        <a href="/store/login.html" class="top-nav-back" id="productsLogout">Log out</a>
      </div>
    </header>
    <main class="main-content store-main">
      <div class="store-toolbar">
        <input type="search" id="searchInput" placeholder="Search products..." class="store-search">
      </div>
      <div class="store-list-wrap">
        <div class="loading" id="loading">Loading…</div>
        <table class="store-list-table" id="productTable" style="display:none">
          <thead>
            <tr>
              <th class="store-list-thumb">Image</th>
              <th>Name</th>
              <th>SKU</th>
              <th>Category</th>
              <th class="num">Price</th>
              <th class="store-list-actions">Add to cart</th>
            </tr>
          </thead>
          <tbody id="productBody"></tbody>
        </table>
      </div>
    </main>
    <div id="podModal" class="pod-modal" style="display:none" aria-hidden="true">
      <div class="pod-modal-backdrop"></div>
      <div class="pod-modal-box">
        <h2 class="pod-modal-title" id="podModalTitle">Customize your print</h2>
        <p class="pod-modal-subtitle">Enter your information. The preview updates as you type.</p>
        <div class="pod-qty-row">
          <label for="podQty">Quantity</label>
          <input type="number" id="podQty" min="1" value="1" class="pod-qty-input">
        </div>
        <div class="pod-modal-body">
          <div class="pod-form-wrap" id="podFormWrap"></div>
          <div class="pod-proof-wrap">
            <div class="pod-proof-label">Live preview</div>
            <div id="podProof" class="pod-proof"></div>
            <div class="pod-proof-label" style="margin-top:0.75rem;">PDF preview</div>
            <div class="pod-proof-pdf-wrap">
              <iframe id="podPdfFrame" class="pod-proof-pdf" title="PDF proof" loading="lazy"></iframe>
            </div>
          </div>
        </div>
        <div class="pod-modal-actions">
          <button type="button" class="btn-apply" id="podAddToCartBtn">Add to cart</button>
          <button type="button" class="btn-secondary pod-modal-cancel" id="podCancelBtn">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    let products = [];
    const body = document.getElementById("productBody");
    const cartCount = document.getElementById("cartCount");
    const searchInput = document.getElementById("searchInput");
    const params = new URLSearchParams(location.search);
    const categoryFilter = params.get("category") || "";

    function escape(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function formatPrice(n) {
      return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function isImageFile(filename) {
      const ext = (filename || "").toLowerCase();
      return [".jpg", ".jpeg", ".png", ".gif", ".webp"].some((e) => ext.endsWith(e));
    }

    function getFirstImageFile(files) {
      return (files || []).find((f) => isImageFile(f.filename));
    }

    function getFirstFile(files) {
      return (files || [])[0];
    }

    function getImageUrl(file) {
      if (!file) return "";
      if (typeof file === "object" && file.url) return file.url;
      const p = typeof file === "string" ? file : file?.path;
      if (!p) return "";
      return "/uploads/" + p.split("/").map(encodeURIComponent).join("/");
    }

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem("storeCart") || "[]");
      } catch {
        return [];
      }
    }

    function setCart(cart) {
      localStorage.setItem("storeCart", JSON.stringify(cart));
      cartCount.textContent = cart.reduce((s, i) => s + (i.quantity || 1), 0);
    }

    function getAvailableQty(p) {
      if ((p.productType || "regular") === "kit" && p.kitItems?.length) {
        let min = Infinity;
        for (const ki of p.kitItems) {
          const childQty = ki.product?.quantity ?? 0;
          const qtyPerKit = Math.max(1, ki.quantity);
          min = Math.min(min, Math.floor(childQty / qtyPerKit));
        }
        return min === Infinity ? 0 : min;
      }
      return p.quantity ?? 0;
    }

    function addToCart(productId, qty, printData) {
      const p = products.find((x) => x.id === productId);
      if (!p) return;
      const available = getAvailableQty(p);
      const cart = getCart();
      const existing = cart.find((i) => i.productId === productId && JSON.stringify(i.printData || {}) === JSON.stringify(printData || {}));
      const requested = (existing ? existing.quantity : 0) + qty;
      if (requested > available) {
        alert("Out of stock: " + p.name + ". Only " + available + " available.");
        return;
      }
      const imageFile = getFirstImageFile(p.files);
      const pdfFile = getFirstFile(p.files);
      const imgUrl = imageFile
        ? getImageUrl(imageFile)
        : pdfFile ? "/api/products/" + p.id + "/preview" : null;
      if (existing) {
        existing.quantity = (existing.quantity || 1) + qty;
        if (!existing.imageUrl && imgUrl) existing.imageUrl = imgUrl;
      } else {
        const item = {
          productId: p.id,
          sku: p.sku,
          quantity: qty,
          name: p.name,
          price: p.price,
          imageUrl: imgUrl || null,
        };
        if (printData && typeof printData === "object" && Object.keys(printData).length) item.printData = printData;
        cart.push(item);
      }
      setCart(cart);
    }

    function render(rows) {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = q
        ? rows.filter(
            (p) =>
              (p.name || "").toLowerCase().includes(q) ||
              (p.sku || "").toLowerCase().includes(q) ||
              (p.category || "").toLowerCase().includes(q)
          )
        : rows;
      const regular = filtered.filter((p) => (p.productType || "regular") !== "kit" || !p.kitItems?.length);

      if (regular.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="store-empty">No products found.</td></tr>';
        return;
      }

      body.innerHTML = regular
        .map((p) => {
          const imageFile = getFirstImageFile(p.files);
          const pdfFile = getFirstFile(p.files);
          const imgUrl = imageFile
            ? getImageUrl(imageFile)
            : pdfFile
              ? "/api/products/" + p.id + "/preview"
              : null;
          const isPdfOnly = pdfFile && !imageFile;
          const thumb = imgUrl
            ? isPdfOnly
              ? '<a href="' +
                getImageUrl(pdfFile) +
                '" target="_blank" class="store-list-thumb-link" title="PDF"><img src="' +
                imgUrl +
                '" alt="" class="store-list-thumb-img store-list-thumb-contain"></a>'
              : '<img src="' + imgUrl + '" alt="" class="store-list-thumb-img store-list-thumb-contain" loading="lazy">'
            : '<div class="store-list-thumb-placeholder">—</div>';
          const isPOD = !!(p.isPrintOnDemand && p.printTemplateConfig);
          const actionsCell = isPOD
            ? '<button type="button" class="btn-apply store-pod-customize-btn" data-id="' + p.id + '">Customize & Add</button>'
            : '<input type="number" min="1" value="1" class="store-qty-input store-list-qty" data-id="' + p.id + '">' +
              '<button type="button" class="btn-apply store-add-btn" data-id="' + p.id + '">Add</button>';
          return (
            "<tr>" +
            '<td class="store-list-thumb-cell">' +
            thumb +
            "</td>" +
            "<td>" +
            escape(p.name) +
            "</td>" +
            "<td>" +
            escape(p.sku) +
            "</td>" +
            "<td>" +
            (p.category ? '<span class="store-category-tag">' + escape(p.category) + "</span>" : "—") +
            "</td>" +
            '<td class="num">$' +
            formatPrice(p.price) +
            "</td>" +
            '<td class="store-list-actions">' +
            actionsCell +
            "</td>" +
            "</tr>"
          );
        })
        .join("");

      body.querySelectorAll(".store-add-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.id);
          const input = body.querySelector('.store-list-qty[data-id="' + id + '"]');
          const qty = Math.max(1, parseInt(input?.value, 10) || 1);
          addToCart(id, qty);
        });
      });
      body.querySelectorAll(".store-pod-customize-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.id);
          const p = products.find((x) => x.id === id);
          if (p) openPODModal(p);
        });
      });
    }

    function getPODConfig(product) {
      let config = { layout: "business_card", fields: [] };
      try {
        const raw = product.printTemplateConfig;
        if (raw && typeof raw === "string") config = JSON.parse(raw);
        else if (raw && typeof raw === "object") config = raw;
      } catch (_) {}
      if (!config.fields || !Array.isArray(config.fields)) {
        config.fields = [
          { key: "name", label: "Full Name" },
          { key: "title", label: "Title" },
          { key: "company", label: "Company" },
          { key: "phone", label: "Phone" },
          { key: "email", label: "Email" },
        ];
      }
      return config;
    }

    let currentPODProduct = null;
    let currentPODQty = 1;

    function openPODModal(product) {
      currentPODProduct = product;
      currentPODQty = 1;
      const config = getPODConfig(product);
      document.getElementById("podModalTitle").textContent = "Customize: " + (product.name || "Print");
      const formWrap = document.getElementById("podFormWrap");
      formWrap.innerHTML = "";
      const values = {};
      config.fields.forEach((f) => {
        const key = f.key || "field";
        values[key] = "";
        const label = document.createElement("label");
        label.textContent = f.label || key;
        label.setAttribute("for", "pod-" + key);
        const input = document.createElement("input");
        input.type = "text";
        input.id = "pod-" + key;
        input.name = key;
        input.placeholder = f.label || key;
        input.className = "pod-input";
        input.addEventListener("input", () => updatePODProof(config, getPODFormValues(config)));
        input.addEventListener("change", () => updatePODProof(config, getPODFormValues(config)));
        formWrap.appendChild(label);
        formWrap.appendChild(input);
      });
      document.getElementById("podModal").style.display = "flex";
      document.getElementById("podModal").setAttribute("aria-hidden", "false");
      updatePODProof(config, values);
    }

    function getPODFormValues(config) {
      const values = {};
      (config.fields || []).forEach((f) => {
        const key = f.key || "field";
        const el = document.getElementById("pod-" + key);
        values[key] = el ? el.value.trim() : "";
      });
      return values;
    }

    function updatePODProof(config, values) {
      const proof = document.getElementById("podProof");
      const layout = (config.layout || "business_card").toLowerCase();
      proof.className = "pod-proof pod-proof-" + layout;
      if (layout === "business_card") {
        proof.innerHTML =
          "<div class=\"pod-proof-card\">" +
          "<div class=\"pod-proof-name\">" + escape(values.name || "Your Name") + "</div>" +
          "<div class=\"pod-proof-title\">" + escape(values.title || "Title") + "</div>" +
          "<div class=\"pod-proof-company\">" + escape(values.company || "Company") + "</div>" +
          "<div class=\"pod-proof-contact\">" +
          escape(values.phone || "Phone") +
          (values.email ? " · " + escape(values.email) : "") +
          "</div>" +
          "</div>";
      } else {
        proof.innerHTML = (config.fields || [])
          .map((f) => {
            const v = values[f.key] || "";
            return "<div class=\"pod-proof-line\"><strong>" + escape(f.label) + "</strong> " + escape(v) + "</div>";
          })
          .join("");
      }
      schedulePdfPreview(config, values);
    }

    function closePODModal() {
      document.getElementById("podModal").style.display = "none";
      document.getElementById("podModal").setAttribute("aria-hidden", "true");
      const frame = document.getElementById("podPdfFrame");
      if (frame) frame.src = "";
      currentPODProduct = null;
    }

    let pdfPreviewTimeout = null;
    let currentPdfObjectUrl = null;

    function schedulePdfPreview(config, values) {
      if (!currentPODProduct) return;
      if (pdfPreviewTimeout) {
        clearTimeout(pdfPreviewTimeout);
      }
      pdfPreviewTimeout = setTimeout(() => {
        loadPdfPreview(currentPODProduct.id, values);
      }, 500);
    }

    async function loadPdfPreview(productId, printData) {
      try {
        const res = await fetch("/api/products/" + productId + "/pod-preview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ printData }),
        });
        if (!res.ok) {
          return;
        }
        const blob = await res.blob();
        if (currentPdfObjectUrl) {
          URL.revokeObjectURL(currentPdfObjectUrl);
        }
        const url = URL.createObjectURL(blob);
        currentPdfObjectUrl = url;
        const frame = document.getElementById("podPdfFrame");
        if (frame) {
          frame.src = url;
        }
      } catch (_) {
        // ignore preview errors for now
      }
    }

    document.getElementById("podCancelBtn").addEventListener("click", closePODModal);
    document.querySelector(".pod-modal-backdrop").addEventListener("click", closePODModal);
    document.getElementById("podAddToCartBtn").addEventListener("click", () => {
      if (!currentPODProduct) return;
      const qty = Math.max(1, parseInt(document.getElementById("podQty").value, 10) || 1);
      const config = getPODConfig(currentPODProduct);
      const printData = getPODFormValues(config);
      addToCart(currentPODProduct.id, qty, printData);
      closePODModal();
    });
    document.getElementById("podModal").addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePODModal();
    });

    async function load() {
      try {
        const url = categoryFilter
          ? "/api/products?category=" + encodeURIComponent(categoryFilter)
          : "/api/products";
        const res = await fetch(url, { credentials: "include" });
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = "/store/login.html";
            return;
          }
          throw new Error("Failed to load products");
        }
        products = await res.json();
        document.getElementById("loading").style.display = "none";
        document.getElementById("productTable").style.display = "table";
        document.getElementById("pageTitle").textContent = categoryFilter ? categoryFilter : "All products";
        render(products);
      } catch (e) {
        body.innerHTML = '<tr><td colspan="6" class="store-empty error">' + escape(e.message) + "</td></tr>";
      }
    }

    searchInput.addEventListener("input", () => render(products));
    cartCount.textContent = getCart().reduce((s, i) => s + (i.quantity || 1), 0);

    document.getElementById("productsLogout")?.addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = "/store/login.html";
    });

    load();
  </script>
</body>
</html>
