<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Store</title>
  <link rel="stylesheet" href="/styles.css">
  <script>var _b="__STORE_BASE__",_s="__STORE_SLUG__";if(!_b||_b.indexOf("__")===0){var m=location.pathname.match(/^\/store\/([^/]+)/);window.STORE_BASE=m?"/store/"+m[1]:"/store";window.STORE_SLUG=m?m[1]:null;}else{window.STORE_BASE=_b;window.STORE_SLUG=_s;}window.STORE_CART_KEY=window.STORE_SLUG?"storeCart_"+window.STORE_SLUG:"storeCart";</script>
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple store-nav">
      <a href="__STORE_BASE__/" class="top-nav-back">← Categories</a>
      <a href="__STORE_BASE__/" class="top-nav-brand nav-logo-wrap"><img src="__STORE_LOGO__" alt="Store" class="nav-logo"></a>
      <span class="top-nav-brand" id="pageTitle">Products</span>
      <div class="store-nav-right">
        <a href="__STORE_BASE__/cart" class="store-cart-link">Cart (<span id="cartCount">0</span>)</a>
        <a href="__STORE_BASE__/orders" class="store-orders-link">My Orders</a>
        <a href="__STORE_BASE__/settings" class="store-settings-link" title="Settings">⚙ Settings</a>
        <a href="__STORE_BASE__/login" class="top-nav-back" id="productsLogout">Log out</a>
      </div>
    </header>
    <main class="main-content store-main">
      <div class="store-toolbar">
        <input type="search" id="searchInput" placeholder="Search products..." class="store-search">
      </div>
      <div class="store-list-wrap">
        <div class="loading" id="loading">Loading…</div>
        <table class="store-list-table" id="productTable" style="display:none">
          <thead>
            <tr>
              <th class="store-list-thumb">Image</th>
              <th>Name</th>
              <th>SKU</th>
              <th>Category</th>
              <th class="num">Price</th>
              <th class="store-list-actions">Add to cart</th>
            </tr>
          </thead>
          <tbody id="productBody"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script>
    let products = [];
    const body = document.getElementById("productBody");
    const cartCount = document.getElementById("cartCount");
    const searchInput = document.getElementById("searchInput");
    const params = new URLSearchParams(location.search);
    const categoryFilter = params.get("category") || "";

    function escape(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function formatPrice(n) {
      return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function isImageFile(filename) {
      const ext = (filename || "").toLowerCase();
      return [".jpg", ".jpeg", ".png", ".gif", ".webp"].some((e) => ext.endsWith(e));
    }

    function getFirstImageFile(files) {
      return (files || []).find((f) => isImageFile(f.filename));
    }

    function getFirstFile(files) {
      return (files || [])[0];
    }

    function getImageUrl(file) {
      if (!file) return "";
      if (typeof file === "object" && file.url) {
        const u = file.url;
        if (u && (u.startsWith("http://") || u.startsWith("https://"))) return u;
        return u || "";
      }
      const p = typeof file === "string" ? file : file?.path;
      if (!p) return "";
      if (p.startsWith("http://") || p.startsWith("https://")) return p;
      return "/uploads/" + p.split("/").map(encodeURIComponent).join("/");
    }

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem(window.STORE_CART_KEY || "storeCart") || "[]");
      } catch {
        return [];
      }
    }

    function setCart(cart) {
      localStorage.setItem(window.STORE_CART_KEY || "storeCart", JSON.stringify(cart));
      cartCount.textContent = cart.reduce((s, i) => s + (i.quantity || 1), 0);
    }

    function parseAllowedQuantities(val) {
      if (!val) return null;
      try {
        const arr = typeof val === "string" && val.startsWith("[") ? JSON.parse(val) : val;
        return Array.isArray(arr) && arr.length ? arr.map((n) => parseInt(n, 10)).filter((n) => !isNaN(n) && n > 0) : null;
      } catch (_) {
        return null;
      }
    }

    /** Build dropdown options for quantity. Uses min/max or common values. */
    function getQtyDropdownOptions(minQty, maxQty) {
      const min = minQty != null ? Math.max(1, minQty) : 1;
      const max = maxQty != null ? Math.max(min, maxQty) : 1000;
      if (max - min <= 50) {
        return Array.from({ length: max - min + 1 }, (_, i) => min + i);
      }
      const steps = [1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
      const opts = [...new Set(steps.filter((s) => s >= min && s <= max).concat(min, max))].sort((a, b) => a - b);
      return opts.length ? opts : [min];
    }

    function getAvailableQty(p) {
      if ((p.productType || "regular") === "kit" && p.kitItems?.length) {
        let min = Infinity;
        for (const ki of p.kitItems) {
          const childQty = ki.product?.quantity ?? 0;
          const qtyPerKit = Math.max(1, ki.quantity);
          min = Math.min(min, Math.floor(childQty / qtyPerKit));
        }
        return min === Infinity ? 0 : min;
      }
      return p.quantity ?? 0;
    }

    function addToCart(productId, qty, printData) {
      const p = products.find((x) => x.id === productId);
      if (!p) return;
      const allowed = parseAllowedQuantities(p.allowedQuantities);
      if (allowed && allowed.length && !allowed.includes(qty)) {
        alert(p.name + " can only be ordered in quantities of: " + allowed.join(", "));
        return;
      }
      const minQty = p.minOrderQty != null ? Number(p.minOrderQty) : null;
      const maxQty = p.maxOrderQty != null ? Number(p.maxOrderQty) : null;
      if (minQty != null && qty < minQty) {
        alert(p.name + " requires a minimum order quantity of " + minQty);
        return;
      }
      if (maxQty != null && qty > maxQty) {
        alert(p.name + " has a maximum order quantity of " + maxQty);
        return;
      }
      const available = getAvailableQty(p);
      const cart = getCart();
      const existing = cart.find((i) => i.productId === productId && JSON.stringify(i.printData || {}) === JSON.stringify(printData || {}));
      const requested = (existing ? existing.quantity : 0) + qty;
      if (requested > available) {
        alert("Out of stock: " + p.name + ". Only " + available + " available.");
        return;
      }
      const imageFile = getFirstImageFile(p.files);
      const pdfFile = getFirstFile(p.files);
      const previewBase = "/api/products/" + p.id + "/preview" + (window.STORE_SLUG ? "?deployment=" + encodeURIComponent(window.STORE_SLUG) : "");
      const imgUrl = (p.imageUrl && (p.imageUrl.startsWith("http://") || p.imageUrl.startsWith("https://")))
        ? p.imageUrl
        : imageFile ? getImageUrl(imageFile) : pdfFile ? previewBase : null;
      if (existing) {
        existing.quantity = (existing.quantity || 1) + qty;
        if (!existing.imageUrl && imgUrl) existing.imageUrl = imgUrl;
        if (p.rushFee != null && Number(p.rushFee) > 0) {
          existing.rushFee = Number(p.rushFee);
          if (typeof existing.rushSelected !== "boolean") existing.rushSelected = false;
        } else {
          delete existing.rushFee;
          delete existing.rushSelected;
        }
      } else {
        const item = {
          productId: p.id,
          sku: p.sku,
          quantity: qty,
          name: p.name,
          price: p.price,
          imageUrl: imgUrl || null,
          allowedQuantities: p.allowedQuantities || null,
          minOrderQty: p.minOrderQty ?? null,
          maxOrderQty: p.maxOrderQty ?? null,
        };
        if (p.rushFee != null && Number(p.rushFee) > 0) {
          item.rushFee = Number(p.rushFee);
          item.rushSelected = false;
        }
        if (printData && typeof printData === "object" && Object.keys(printData).length) item.printData = printData;
        cart.push(item);
      }
      setCart(cart);
    }

    function render(rows) {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = q
        ? rows.filter(
            (p) =>
              (p.name || "").toLowerCase().includes(q) ||
              (p.sku || "").toLowerCase().includes(q) ||
              (p.category || "").toLowerCase().includes(q)
          )
        : rows;
      const regular = filtered.filter((p) => (p.productType || "regular") !== "kit" || !p.kitItems?.length);

      if (regular.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="store-empty">No products found.</td></tr>';
        return;
      }

      body.innerHTML = regular
        .map((p) => {
          const imageFile = getFirstImageFile(p.files);
          const pdfFile = getFirstFile(p.files);
          const isPOD = !!(p.isPrintOnDemand && p.printTemplateConfig);
          const previewBase = "/api/products/" + p.id + "/preview" + (window.STORE_SLUG ? "?deployment=" + encodeURIComponent(window.STORE_SLUG) : "");
          const imgUrl = (p.imageUrl && (p.imageUrl.startsWith("http://") || p.imageUrl.startsWith("https://")))
            ? p.imageUrl
            : imageFile
            ? getImageUrl(imageFile)
            : pdfFile
              ? previewBase
              : isPOD
                ? previewBase
                : null;
          const isPdfOnly = pdfFile && !imageFile;
          const thumb = imgUrl
            ? isPdfOnly
              ? '<a href="' +
                getImageUrl(pdfFile) +
                '" target="_blank" class="store-list-thumb-link" title="PDF"><span class="store-list-thumb-wrap"><img src="' +
                imgUrl +
                '" alt="" class="store-list-thumb-img store-list-thumb-contain" loading="lazy" onerror="this.nextElementSibling.style.display=\'block\';this.style.display=\'none\'"><span class="store-list-thumb-placeholder" style="display:none">—</span></span></a>'
              : '<span class="store-list-thumb-wrap"><img src="' + imgUrl + '" alt="" class="store-list-thumb-img store-list-thumb-contain" loading="lazy" onerror="this.nextElementSibling.style.display=\'block\';this.style.display=\'none\'"><span class="store-list-thumb-placeholder" style="display:none">—</span></span>'
            : '<div class="store-list-thumb-placeholder">—</div>';
          const allowedQty = parseAllowedQuantities(p.allowedQuantities);
          const minQty = p.minOrderQty != null ? Number(p.minOrderQty) : 1;
          const maxQty = p.maxOrderQty != null ? Number(p.maxOrderQty) : null;
          const qtyOptions = allowedQty && allowedQty.length
            ? allowedQty
            : getQtyDropdownOptions(minQty, maxQty);
          const defaultQty = qtyOptions[0];
          const qtyControl = '<select class="store-qty-select store-list-qty" data-id="' + p.id + '">' +
            qtyOptions.map((q) => '<option value="' + q + '">' + q + '</option>').join("") + "</select>";
          const actionsCell = isPOD
            ? '<button type="button" class="btn-apply store-pod-customize-btn" data-id="' + p.id + '">Customize & Add</button>'
            : qtyControl + '<button type="button" class="btn-apply store-add-btn" data-id="' + p.id + '">Add</button>';
          return (
            "<tr>" +
            '<td class="store-list-thumb-cell">' +
            thumb +
            "</td>" +
            "<td>" +
            escape(p.name) +
            "</td>" +
            "<td>" +
            escape(p.sku) +
            "</td>" +
            "<td>" +
            (p.category ? '<span class="store-category-tag">' + escape(p.category) + "</span>" : "—") +
            "</td>" +
            '<td class="num">$' +
            formatPrice(p.price) +
            "</td>" +
            '<td class="store-list-actions">' +
            actionsCell +
            "</td>" +
            "</tr>"
          );
        })
        .join("");

      body.querySelectorAll(".store-add-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.id);
          const qtyEl = body.querySelector('.store-list-qty[data-id="' + id + '"]');
          const qty = Math.max(1, parseInt(qtyEl?.value, 10) || 1);
          addToCart(id, qty);
        });
      });
      body.querySelectorAll(".store-pod-customize-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.id);
          const base = window.STORE_BASE || "/store";
          window.location.href = base + "/fill?product=" + id;
        });
      });
    }

    async function load() {
      try {
        const params = new URLSearchParams();
        if (window.STORE_SLUG) params.set("deployment", window.STORE_SLUG);
        if (categoryFilter) params.set("category", categoryFilter);
        const url = "/api/products" + (params.toString() ? "?" + params.toString() : "");
        const res = await fetch(url, { credentials: "include" });
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = (window.STORE_BASE || "/store") + "/login";
            return;
          }
          throw new Error("Failed to load products");
        }
        products = await res.json();
        document.getElementById("loading").style.display = "none";
        document.getElementById("productTable").style.display = "table";
        document.getElementById("pageTitle").textContent = categoryFilter ? categoryFilter : "All products";
        render(products);
      } catch (e) {
        body.innerHTML = '<tr><td colspan="6" class="store-empty error">' + escape(e.message) + "</td></tr>";
      }
    }

    searchInput.addEventListener("input", () => render(products));
    cartCount.textContent = getCart().reduce((s, i) => s + (i.quantity || 1), 0);

    document.getElementById("productsLogout")?.addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = (window.STORE_BASE || "/store") + "/login";
    });

    load();
  </script>
</body>
</html>
