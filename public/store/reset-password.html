<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password - __STORE_NAME__</title>
  <link rel="stylesheet" href="/styles.css">
  <script>var _b="__STORE_BASE__",_s="__STORE_SLUG__";if(!_b||_b.indexOf("__")===0){var m=location.pathname.match(/^\/store\/([^/]+)/);window.STORE_BASE=m?"/store/"+m[1]:"/store";window.STORE_SLUG=m?m[1]:null;}else{window.STORE_BASE=_b;window.STORE_SLUG=_s;}</script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo"><img src="__STORE_LOGO__" alt="__STORE_NAME__" class="nav-logo"></div>
      <h1 class="login-title">Set new password</h1>
      <p class="login-subtitle">Enter your new password below</p>
      <p class="login-store-link"><a href="__STORE_BASE__/login">← Back to sign in</a></p>
      <form id="resetForm" class="login-form">
        <input type="hidden" id="token" name="token" value="">
        <div class="login-field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="6" autocomplete="new-password" placeholder="••••••••">
        </div>
        <div class="login-field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password" placeholder="••••••••">
        </div>
        <div id="resetError" class="login-error" style="display:none"></div>
        <div id="resetSuccess" class="login-success" style="display:none"></div>
        <button type="submit" class="login-btn" id="resetBtn">Reset password</button>
      </form>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token");
    const tokenInput = document.getElementById("token");
    const form = document.getElementById("resetForm");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const errorEl = document.getElementById("resetError");
    const successEl = document.getElementById("resetSuccess");
    const btn = document.getElementById("resetBtn");

    if (!token) {
      errorEl.textContent = "Invalid reset link. Please request a new password reset.";
      errorEl.style.display = "block";
      form.querySelectorAll("input, button").forEach((el) => (el.disabled = true));
    } else {
      tokenInput.value = token;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      successEl.style.display = "none";
      errorEl.textContent = "";
      successEl.textContent = "";

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (newPassword !== confirmPassword) {
        errorEl.textContent = "Passwords do not match.";
        errorEl.style.display = "block";
        return;
      }
      if (newPassword.length < 6) {
        errorEl.textContent = "Password must be at least 6 characters.";
        errorEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Resetting…";

      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword }),
          credentials: "include",
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.message || "Reset failed. The link may have expired.");
        }

        const loginUrl = (window.STORE_BASE || "/store") + "/login";
        successEl.textContent = (data.message || "Password reset successfully.") + " Redirecting to sign in…";
        successEl.style.display = "block";
        btn.disabled = true;
        setTimeout(() => { window.location.href = loginUrl; }, 2000);
      } catch (err) {
        errorEl.textContent = err.message || "Something went wrong.";
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Reset password";
      }
    });
  </script>
</body>
</html>
