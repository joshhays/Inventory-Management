<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Store</title>
  <link rel="stylesheet" href="/styles.css">
  <script>var _b="__STORE_BASE__",_s="__STORE_SLUG__";if(!_b||_b.indexOf("__")===0){var m=location.pathname.match(/^\/store\/([^/]+)/);window.STORE_BASE=m?"/store/"+m[1]:"/store";window.STORE_SLUG=m?m[1]:null;}else{window.STORE_BASE=_b;window.STORE_SLUG=_s;}window.STORE_CART_KEY=window.STORE_SLUG?"storeCart_"+window.STORE_SLUG:"storeCart";</script>
  <script>window.STORE_CART_DISCLAIMER=__STORE_CART_DISCLAIMER_JS__;</script>
  <script>window.STORE_BILLING_OPTIONS=__STORE_BILLING_OPTIONS_JS__;</script>
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple store-nav">
      <a href="__STORE_BASE__/" class="top-nav-back">← Continue shopping</a>
      <a href="__STORE_BASE__/" class="top-nav-brand nav-logo-wrap"><img src="__STORE_LOGO__" alt="Store" class="nav-logo"></a>
      <div class="store-nav-right">
        <a href="__STORE_BASE__/cart" class="store-cart-link store-cart-link-active">Cart (<span id="cartCount">0</span>)</a>
        <a href="__STORE_BASE__/orders" class="store-orders-link">My Orders</a>
        <a href="__STORE_BASE__/approvals" class="store-approvals-link" title="Approve orders">✓ Approvals</a>
        <a href="__STORE_BASE__/settings" class="store-settings-link" title="Settings">⚙ Settings</a>
        <a href="#" id="cartLogout" class="top-nav-back">Log out</a>
      </div>
    </header>
    <main class="main-content store-cart-main">
      <div id="cartContent">
        <div class="loading" id="loading">Loading…</div>
      </div>
      <aside id="checkoutSidebar" class="store-checkout-sidebar" style="display:none">
        <div class="store-checkout-box">
          <h2 class="store-checkout-title">Order summary</h2>
          <div id="orderSummary" class="store-order-summary"></div>
          <div class="store-checkout-divider"></div>
          <div class="store-form-row">
            <label for="savedAddress">Saved address</label>
            <select id="savedAddress">
              <option value="">-- Enter new or select --</option>
            </select>
          </div>
          <div class="store-shipping-form">
            <div class="store-form-row">
              <label for="shipName">Full name</label>
              <input type="text" id="shipName" placeholder="John Doe">
            </div>
            <div class="store-form-row">
              <label for="shipCompany">Company (optional)</label>
              <input type="text" id="shipCompany" placeholder="Acme Inc">
            </div>
            <div class="store-form-row">
              <label for="shipAddress1">Address line 1</label>
              <input type="text" id="shipAddress1" placeholder="123 Main St">
            </div>
            <div class="store-form-row">
              <label for="shipAddress2">Address line 2 (optional)</label>
              <input type="text" id="shipAddress2" placeholder="Apt 4, Suite 100">
            </div>
            <div class="store-form-row store-form-row-inline">
              <div>
                <label for="shipCity">City</label>
                <input type="text" id="shipCity" placeholder="Chicago">
              </div>
              <div>
                <label for="shipState">State</label>
                <input type="text" id="shipState" placeholder="IL">
              </div>
              <div>
                <label for="shipZip">ZIP</label>
                <input type="text" id="shipZip" placeholder="60601">
              </div>
            </div>
          </div>
          <div class="store-form-row">
            <label for="customerPhone">Phone (optional)</label>
            <input type="tel" id="customerPhone" placeholder="For delivery updates">
          </div>
          <div class="store-form-row" id="billingRow">
            <label for="billingSelect" id="billingLabel">Billing</label>
            <select id="billingSelect" style="display:none" aria-describedby="billingHint"></select>
            <input type="text" id="billingInput" style="display:none" maxlength="500" placeholder="Cost center or billing notes (optional)" autocomplete="organization">
            <p id="billingHint" class="store-form-hint" style="display:none;margin:0.25rem 0 0;font-size:0.85rem;color:var(--text-muted)">Choose how this order should be billed.</p>
          </div>
          <div class="store-form-row store-shipping-rates-row" id="shippingRatesRow">
            <label>Shipping</label>
            <div id="shippingRatesContainer">
              <button type="button" class="btn-secondary store-get-rates" id="getRatesBtn">Get shipping rates</button>
              <div id="shippingRatesList" class="store-shipping-rates-list"></div>
              <p id="shippingRatesError" class="store-shipping-error" style="display:none"></p>
            </div>
          </div>
          <div class="store-form-row store-proof-approved-row" id="proofApprovedRow" style="display:none">
            <label class="store-proof-approved-label">
              <input type="checkbox" id="proofApproved" required>
              <span>Proof approved</span>
            </label>
            <p class="store-proof-approved-hint">You must review and approve the print proof above before checkout.</p>
          </div>
          <button type="button" class="btn-apply store-place-order" id="placeOrderBtn">
            Place your order
          </button>
        </div>
      </aside>
    </main>
  </div>
  <script>
    function escape(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }
    function escapeAttr(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    function cartDisclaimerBlock() {
      const t = typeof window.STORE_CART_DISCLAIMER === "string" ? window.STORE_CART_DISCLAIMER.trim() : "";
      if (!t) return "";
      return `<div class="store-cart-disclaimer" role="note"><p class="store-cart-disclaimer-text">${escape(t).replace(/\n/g, "<br>")}</p></div>`;
    }

    function formatPrice(n) {
      return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem(window.STORE_CART_KEY || "storeCart") || "[]");
      } catch {
        return [];
      }
    }

    function setCart(cart) {
      localStorage.setItem(window.STORE_CART_KEY || "storeCart", JSON.stringify(cart));
      const count = cart.reduce((s, i) => s + (i.quantity || 1), 0);
      const el = document.getElementById("cartCount");
      if (el) el.textContent = count;
    }

    function parseAllowedQuantities(val) {
      if (!val) return null;
      try {
        const arr = typeof val === "string" && val.startsWith("[") ? JSON.parse(val) : val;
        return Array.isArray(arr) && arr.length ? arr.map((n) => parseInt(n, 10)).filter((n) => !isNaN(n) && n > 0) : null;
      } catch (_) {
        return null;
      }
    }

    function getQtyDropdownOptions(minQty, maxQty) {
      const min = minQty != null ? Math.max(1, minQty) : 1;
      const max = maxQty != null ? Math.max(min, maxQty) : 1000;
      if (max - min <= 50) {
        return Array.from({ length: max - min + 1 }, (_, i) => min + i);
      }
      const steps = [1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
      const opts = [...new Set(steps.filter((s) => s >= min && s <= max).concat(min, max))].sort((a, b) => a - b);
      return opts.length ? opts : [min];
    }

    function getPriceFromMatrix(matrix, qtyPerDesign, numDesigns) {
      if (!matrix || typeof matrix !== "object") return null;
      const row = matrix[String(qtyPerDesign)];
      if (!row || typeof row !== "object") return null;
      const total = row[String(numDesigns)];
      if (total == null || typeof total !== "number") return null;
      const totalCards = qtyPerDesign * numDesigns;
      return totalCards > 0 ? total / totalCards : null;
    }

    function findBestPriceForTotalCards(matrix, totalCards, fallbackUnitPrice) {
      if (!matrix || typeof matrix !== "object" || totalCards <= 0) return fallbackUnitPrice;
      const tiers = [];
      for (const qtyStr of Object.keys(matrix)) {
        const row = matrix[qtyStr];
        if (!row || typeof row !== "object") continue;
        const qty = parseInt(qtyStr, 10);
        if (isNaN(qty) || qty <= 0) continue;
        for (const numStr of Object.keys(row)) {
          const total = row[numStr];
          if (total == null || typeof total !== "number") continue;
          const num = parseInt(numStr, 10);
          if (isNaN(num) || num <= 0) continue;
          const tierCards = qty * num;
          const unit = total / tierCards;
          tiers.push({ tierCards, unit });
        }
      }
      const exact = tiers.filter((t) => t.tierCards === totalCards);
      if (exact.length) return Math.min(...exact.map((t) => t.unit));
      const roundDown = tiers.filter((t) => t.tierCards <= totalCards);
      if (!roundDown.length) return fallbackUnitPrice;
      const closest = Math.max(...roundDown.map((t) => t.tierCards));
      const matches = tiers.filter((t) => t.tierCards === closest);
      return Math.min(...matches.map((t) => t.unit));
    }

    function computePODPrices(cart) {
      const podByProduct = new Map();
      cart.forEach((item, idx) => {
        if (item.printData && Object.keys(item.printData || {}).length && item.pricingMatrix) {
          const pid = item.productId;
          if (!podByProduct.has(pid)) podByProduct.set(pid, []);
          podByProduct.get(pid).push({ item, idx });
        }
      });
      const effectivePrice = new Map();
      podByProduct.forEach((entries, productId) => {
        const totalCards = entries.reduce((s, { item }) => s + (item.quantity || 1), 0);
        const item = entries[0].item;
        try {
          const matrix = typeof item.pricingMatrix === "string" ? JSON.parse(item.pricingMatrix) : item.pricingMatrix;
          const fallback = item.price || 0;
          const unitPrice = findBestPriceForTotalCards(matrix, totalCards, fallback);
          entries.forEach(({ idx }) => effectivePrice.set(idx, unitPrice));
        } catch (_) {}
      });
      return effectivePrice;
    }

    async function updateCartItemByIdx(idx, deltaOrValue, isSet = false) {
      const cart = getCart();
      const item = cart[idx];
      if (!item) return;
      let newQty = isSet ? Math.max(0, parseInt(deltaOrValue, 10) || 0) : Math.max(0, (item.quantity || 1) + deltaOrValue);
      if (newQty <= 0) {
        cart.splice(idx, 1);
        setCart(cart);
        await render();
        return;
      }
      const allowed = parseAllowedQuantities(item.allowedQuantities);
      const minQty = item.minOrderQty != null ? Number(item.minOrderQty) : 1;
      const maxQty = item.maxOrderQty != null ? Number(item.maxOrderQty) : null;
      let finalQty = allowed && allowed.length
        ? (allowed.includes(newQty) ? newQty : allowed.reduce((best, a) => (Math.abs(a - newQty) < Math.abs(best - newQty) ? a : best)))
        : newQty;
      if (!allowed || !allowed.length) {
        finalQty = Math.max(minQty, finalQty);
        if (maxQty != null) finalQty = Math.min(maxQty, finalQty);
      }
      item.quantity = finalQty;
      setCart(cart);
      await render();
    }

    async function render() {
      const cart = getCart();
      const content = document.getElementById("cartContent");
      const sidebar = document.getElementById("checkoutSidebar");
      const summaryEl = document.getElementById("orderSummary");

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="store-cart-empty">
            <h2>Your cart is empty</h2>
            <p>Add items from the store to get started.</p>
            <a href="__STORE_BASE__/" class="btn-apply store-cart-empty-btn">Continue shopping</a>
          </div>
          ${cartDisclaimerBlock()}
        `;
        sidebar.style.display = "none";
        return;
      }

      const shippingRatesRow = document.getElementById("shippingRatesRow");
      if (shippingRatesRow && window.shippingEnabled === undefined) {
        try {
          const statusRes = await fetch("/api/shipping/status?deployment=" + encodeURIComponent(window.STORE_SLUG || ""), { credentials: "include" });
          const statusData = await statusRes.json().catch(() => ({}));
          window.shippingEnabled = statusData.shippingEnabled !== false;
        } catch (_) {
          window.shippingEnabled = true;
        }
      }
      if (shippingRatesRow) {
        shippingRatesRow.style.display = (window.shippingEnabled !== false) ? "block" : "none";
      }

      cart.forEach((i) => {
        const allowed = parseAllowedQuantities(i.allowedQuantities);
        const minQty = i.minOrderQty != null ? Number(i.minOrderQty) : 1;
        const maxQty = i.maxOrderQty != null ? Number(i.maxOrderQty) : null;
        const options = allowed && allowed.length ? allowed : getQtyDropdownOptions(minQty, maxQty);
        const qty = i.quantity || 1;
        if (!options.includes(qty)) {
          i.quantity = options[0];
        }
      });
      setCart(cart);

      const podWithoutMatrix = cart
        .map((i, idx) => ({ i, idx }))
        .filter(({ i }) => i.printData && Object.keys(i.printData || {}).length && !i.pricingMatrix && i.productId);
      if (podWithoutMatrix.length > 0) {
        const productIds = [...new Set(podWithoutMatrix.map(({ i }) => i.productId))];
        const params = new URLSearchParams();
        if (window.STORE_SLUG) params.set("deployment", window.STORE_SLUG);
        try {
          const products = await Promise.all(productIds.map((id) =>
            fetch("/api/products/" + id + (params.toString() ? "?" + params.toString() : ""), { credentials: "include" }).then((r) => r.ok ? r.json() : null)
          ));
          products.forEach((p) => {
            if (!p) return;
            if (p.pricingMatrix) {
              cart.filter((i) => i.productId === p.id && i.printData).forEach((i) => { i.pricingMatrix = p.pricingMatrix; });
            }
            if (p.rushFee != null && Number(p.rushFee) > 0) {
              cart.filter((i) => i.productId === p.id).forEach((i) => {
                i.rushFee = Number(p.rushFee);
                if (typeof i.rushSelected !== "boolean") i.rushSelected = false;
              });
            } else {
              cart.filter((i) => i.productId === p.id).forEach((i) => {
                delete i.rushFee;
                delete i.rushSelected;
              });
            }
          });
          if (products.some((p) => p && (p.pricingMatrix || (p.rushFee != null && Number(p.rushFee) > 0)))) setCart(cart);
        } catch (_) {}
      }

      const effectivePrices = computePODPrices(cart);
      const getItemPrice = (i, idx) => effectivePrices.has(idx) ? effectivePrices.get(idx) : (i.price || 0);

      const subtotal = cart.reduce((s, i, idx) => s + getItemPrice(i, idx) * (i.quantity || 1), 0);
      const rushTotal = cart.reduce((s, i) => {
        const rf = i.rushFee != null ? Number(i.rushFee) : 0;
        return s + (rf > 0 && i.rushSelected ? rf : 0);
      }, 0);
      const itemCount = cart.reduce((s, i) => s + (i.quantity || 1), 0);
      const shippingCost = window.selectedShipping?.totalCharges ?? 0;
      const total = Math.round((subtotal + rushTotal + shippingCost) * 100) / 100;
      const storeBase = window.STORE_BASE || "/store";

      content.innerHTML = `
        <h1 class="store-cart-heading">Shopping cart</h1>
        <p class="store-cart-subheading">${itemCount} ${itemCount === 1 ? "item" : "items"}</p>
        <div class="store-cart-items">
          ${cart
            .map(
              (i, idx) => {
                const itemPrice = getItemPrice(i, idx);
                return `
            <div class="store-cart-card ${i.printData && Object.keys(i.printData).length ? "store-cart-card-has-pod" : ""}" data-idx="${idx}">
              <div class="store-cart-card-img">
                ${i.printData && Object.keys(i.printData).length
                  ? '<div class="store-cart-pod-thumb" data-cart-index="' + idx + '" aria-live="polite"><div class="store-cart-pod-thumb-loading">Loading…</div></div>'
                  : i.imageUrl
                    ? '<img src="' + (i.imageUrl || '').replace(/"/g, '&quot;') + '" alt="" loading="lazy">'
                    : '<div class="store-cart-card-placeholder"><span>📦</span></div>'}
              </div>
              <div class="store-cart-card-body">
                <h3 class="store-cart-card-title">${escape(i.name)}</h3>
                ${i.printData && Object.keys(i.printData).length ? "<p class=\"store-cart-card-print\">Custom print: " + escape(Object.values(i.printData).filter(Boolean).join(", ") || "—") + "</p>" : ""}
                <p class="store-cart-card-sku">SKU: ${escape(i.sku)}</p>
                <p class="store-cart-card-price">$${formatPrice(itemPrice)}</p>
                <div class="store-cart-card-actions">
                  <div class="store-cart-qty-wrap">
                    ${(function() {
                      const allowed = (function() {
                        try {
                          const arr = typeof i.allowedQuantities === "string" && i.allowedQuantities.startsWith("[") ? JSON.parse(i.allowedQuantities) : i.allowedQuantities;
                          return Array.isArray(arr) && arr.length ? arr : null;
                        } catch (_) { return null; }
                      })();
                      const qty = i.quantity || 1;
                      const minQty = i.minOrderQty != null ? Number(i.minOrderQty) : 1;
                      const maxQty = i.maxOrderQty != null ? Number(i.maxOrderQty) : null;
                      const options = allowed && allowed.length ? allowed : getQtyDropdownOptions(minQty, maxQty);
                      const displayQty = options.includes(qty) ? qty : options[0];
                      return '<select class="store-cart-qty-select" data-idx="' + idx + '">' +
                        options.map((n) => '<option value="' + n + '"' + (n === displayQty ? ' selected' : '') + '>' + n + '</option>').join("") +
                        '</select>';
                    })()}
                  </div>
                  <button type="button" class="store-cart-delete" data-idx="${idx}">Delete</button>
                </div>
                ${i.printData && Object.keys(i.printData).length
                  ? '<div class="store-cart-edit-row"><a href="' + storeBase + "/fill?product=" + encodeURIComponent(i.productId) + "&editCart=" + idx + "\" class=\"btn-secondary store-cart-edit-design\">Edit design</a></div>"
                  : ""}
                ${(function() {
                  const rf = i.rushFee != null ? Number(i.rushFee) : 0;
                  if (!(rf > 0)) return "";
                  return '<div class="store-cart-rush-row"><label class="store-cart-rush-label"><input type="checkbox" class="store-cart-rush-cb" data-idx="' + idx + '"' + (i.rushSelected ? " checked" : "") + '><span>Rush processing <span class="store-cart-rush-fee">+$' + formatPrice(rf) + "</span></span></label></div>";
                })()}
              </div>
              <div class="store-cart-card-total">
                $${formatPrice(itemPrice * (i.quantity || 1))}
              </div>
              ${i.printData && Object.keys(i.printData).length ? `<div class="store-cart-pod-preview" data-cart-index="${idx}" aria-live="polite"><div class="store-cart-pod-preview-loading">Loading final preview…</div></div>` : ""}
            </div>
          `;
              }
            )
            .join("")}
        </div>
        ${cartDisclaimerBlock()}
      `;

      summaryEl.innerHTML = `
        <div class="store-summary-row">
          <span>Subtotal (${itemCount} ${itemCount === 1 ? "item" : "items"})</span>
          <span>$${formatPrice(subtotal)}</span>
        </div>
        ${rushTotal > 0 ? `<div class="store-summary-row store-summary-rush"><span>Rush processing</span><span>$${formatPrice(rushTotal)}</span></div>` : ""}
        ${shippingCost > 0 ? `<div class="store-summary-row"><span>Shipping (${escape(window.selectedShipping?.serviceName || "")})</span><span>$${formatPrice(shippingCost)}</span></div>` : ""}
        <div class="store-summary-row store-summary-total">
          <span>Order total</span>
          <span>$${formatPrice(total)}</span>
        </div>
      `;

      const hasPOD = cart.some((i) => i.printData && Object.keys(i.printData).length);
      const proofRow = document.getElementById("proofApprovedRow");
      const proofCheck = document.getElementById("proofApproved");
      const placeOrderBtn = document.getElementById("placeOrderBtn");
      if (proofRow) proofRow.style.display = hasPOD ? "block" : "none";
      if (proofCheck) {
        proofCheck.required = hasPOD;
      }
      if (placeOrderBtn) placeOrderBtn.textContent = hasPOD ? "Submit for Approval" : "Place your order";

      sidebar.style.display = "block";
      loadSavedAddresses();
      setupBillingCheckoutUI();

      content.querySelectorAll(".store-cart-qty-btn").forEach((btn) => {
        btn.addEventListener("click", async () => { await updateCartItemByIdx(Number(btn.dataset.idx), Number(btn.dataset.delta)); });
      });
      content.querySelectorAll(".store-cart-qty-select").forEach((sel) => {
        sel.addEventListener("change", async () => { await updateCartItemByIdx(Number(sel.dataset.idx), Number(sel.value), true); });
      });
      content.querySelectorAll(".store-cart-delete").forEach((btn) => {
        btn.addEventListener("click", async () => { await updateCartItemByIdx(Number(btn.dataset.idx), 0, true); });
      });
      content.querySelectorAll(".store-cart-rush-cb").forEach((cb) => {
        cb.addEventListener("change", () => {
          const idx = Number(cb.dataset.idx);
          const c = getCart();
          if (c[idx]) {
            c[idx].rushSelected = !!cb.checked;
            setCart(c);
            render();
          }
        });
      });

      loadCartPODPreviews(cart, content);
    }

    const cartPODBlobUrls = [];
    function revokeCartPODBlobUrls() {
      cartPODBlobUrls.forEach((u) => URL.revokeObjectURL(u));
      cartPODBlobUrls.length = 0;
    }

    async function loadCartPODPreviews(cart, content) {
      revokeCartPODBlobUrls();
      for (let idx = 0; idx < cart.length; idx++) {
        const item = cart[idx];
        if (!item.printData || !Object.keys(item.printData).length) continue;
        const thumbContainer = content.querySelector(".store-cart-pod-thumb[data-cart-index=\"" + idx + "\"]");
        const previewContainer = content.querySelector(".store-cart-pod-preview[data-cart-index=\"" + idx + "\"]");
        try {
          const res = await fetch("/api/pod/preview", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(item.printData),
          });
          if (!res.ok) {
            let msg = "Preview unavailable";
            const ct = res.headers.get("Content-Type") || "";
            if (ct.includes("application/json")) {
              try {
                const data = await res.json();
                if (data.message) msg = data.message;
              } catch (_) {}
            }
            throw new Error(msg);
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          cartPODBlobUrls.push(url);
          const thumbIframe = "<iframe class=\"store-cart-pod-thumb-iframe\" src=\"" + url.replace(/"/g, "&quot;") + "\" title=\"Print preview\"></iframe>";
          const previewIframe = "<iframe class=\"store-cart-pod-iframe\" src=\"" + url.replace(/"/g, "&quot;") + "\" title=\"Print preview\"></iframe>";
          if (thumbContainer) thumbContainer.innerHTML = thumbIframe;
          if (previewContainer) previewContainer.innerHTML = "<p class=\"store-cart-pod-preview-label\">Final product for review</p>" + previewIframe;
        } catch (e) {
          const errMsg = escape(e.message || "Preview unavailable");
          const errHtml = "<p class=\"store-cart-pod-preview-error\">" + errMsg + "</p>";
          if (thumbContainer) thumbContainer.innerHTML = errHtml;
          if (previewContainer) previewContainer.innerHTML = errHtml;
        }
      }
    }

    window.selectedShipping = null;

    function setupBillingCheckoutUI() {
      const opts = Array.isArray(window.STORE_BILLING_OPTIONS) ? window.STORE_BILLING_OPTIONS : [];
      const row = document.getElementById("billingRow");
      const sel = document.getElementById("billingSelect");
      const inp = document.getElementById("billingInput");
      const hint = document.getElementById("billingHint");
      const lab = document.getElementById("billingLabel");
      if (!row || !sel || !inp) return;
      if (opts.length > 0) {
        row.style.display = "block";
        sel.style.display = "block";
        inp.style.display = "none";
        if (hint) hint.style.display = "block";
        if (lab) lab.textContent = "Billing";
        const prev = sel.value;
        sel.innerHTML = '<option value="">— Select billing —</option>' + opts.map((o) =>
          '<option value="' + escapeAttr(o) + '">' + escape(o) + "</option>"
        ).join("");
        if (prev && opts.some((o) => String(o) === prev)) sel.value = prev;
        sel.required = true;
        inp.required = false;
        inp.value = "";
      } else {
        row.style.display = "block";
        sel.style.display = "none";
        inp.style.display = "block";
        if (hint) hint.style.display = "none";
        if (lab) lab.textContent = "Billing (optional)";
        sel.innerHTML = "";
        sel.required = false;
        inp.required = false;
      }
    }

    function getBillingSelectionForOrder() {
      const opts = Array.isArray(window.STORE_BILLING_OPTIONS) ? window.STORE_BILLING_OPTIONS : [];
      const sel = document.getElementById("billingSelect");
      const inp = document.getElementById("billingInput");
      if (opts.length > 0 && sel && sel.style.display !== "none") {
        return sel.value.trim() || null;
      }
      if (inp && inp.style.display !== "none") {
        const t = inp.value.trim();
        return t || null;
      }
      return null;
    }

    async function fetchShippingRates() {
      const name = document.getElementById("shipName").value.trim();
      const address1 = document.getElementById("shipAddress1").value.trim();
      const city = document.getElementById("shipCity").value.trim();
      const state = document.getElementById("shipState").value.trim();
      const zip = document.getElementById("shipZip").value.trim();
      if (!address1 || !city || !state || !zip) {
        alert("Please enter address, city, state, and ZIP to get shipping rates.");
        return;
      }
      const btn = document.getElementById("getRatesBtn");
      const listEl = document.getElementById("shippingRatesList");
      const errEl = document.getElementById("shippingRatesError");
      btn.disabled = true;
      btn.textContent = "Loading…";
      listEl.innerHTML = "";
      errEl.style.display = "none";
      try {
        const cart = getCart();
        const res = await fetch("/api/shipping/rates", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            deploymentSlug: window.STORE_SLUG || undefined,
            address: { name, address1, address2: document.getElementById("shipAddress2").value.trim() || null, city, state, zip },
            items: cart.map((i) => ({ productId: i.productId, quantity: i.quantity || 1 })),
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (res.status === 401) throw new Error("Please log in to get shipping rates.");
          throw new Error(data.message || "Could not get shipping rates");
        }
        const rates = data.rates || [];
        if (data.shippingDisabled) {
          listEl.innerHTML = "<p class=\"store-shipping-no-rates\">Shipping rates are not available for this store.</p>";
          return;
        }
        if (rates.length === 0) {
          listEl.innerHTML = "<p class=\"store-shipping-no-rates\">No shipping options available.</p>";
          return;
        }
        window.shippingRatesCache = rates;
        listEl.innerHTML = rates.map((r, idx) => `
          <label class="store-shipping-option">
            <input type="radio" name="shippingRate" value="${idx}" ${idx === 0 ? "checked" : ""}>
            <span class="store-shipping-option-name">${escape(r.serviceName)}</span>
            <span class="store-shipping-option-price">$${formatPrice(r.totalCharges)}</span>
            ${r.transitDays != null ? `<span class="store-shipping-option-days">${r.transitDays} business day${r.transitDays !== 1 ? "s" : ""}</span>` : ""}
          </label>
        `).join("");
        listEl.querySelectorAll('input[name="shippingRate"]').forEach((radio) => {
          radio.addEventListener("change", () => {
            const idx = parseInt(radio.value, 10);
            const r = window.shippingRatesCache?.[idx];
            if (r) {
              window.selectedShipping = r;
              render();
            }
          });
        });
        const first = rates[0];
        window.selectedShipping = first;
        render();
      } catch (e) {
        errEl.textContent = e.message || "Failed to load rates";
        errEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Get shipping rates";
      }
    }

    let savedAddressesBound = false;
    async function loadSavedAddresses() {
      const sel = document.getElementById("savedAddress");
      if (!sel) return;
      sel.innerHTML = '<option value="">-- Enter new or select --</option>';
      try {
        const res = await fetch("/api/customer/addresses", { credentials: "include" });
        if (!res.ok) return;
        const data = await res.json();
        const addrs = data.addresses || [];
        addrs.forEach((a) => {
          const opt = document.createElement("option");
          opt.value = JSON.stringify(a);
          opt.textContent = a.label + " - " + a.address1 + ", " + a.city;
          sel.appendChild(opt);
        });
      } catch (_) {}
      if (!savedAddressesBound) {
        savedAddressesBound = true;
        sel.addEventListener("change", () => {
          const val = sel.value;
          if (!val) return;
          try {
            const a = JSON.parse(val);
            document.getElementById("shipName").value = a.name || "";
            document.getElementById("shipCompany").value = a.company || "";
            document.getElementById("shipAddress1").value = a.address1 || "";
            document.getElementById("shipAddress2").value = a.address2 || "";
            document.getElementById("shipCity").value = a.city || "";
            document.getElementById("shipState").value = a.state || "";
            document.getElementById("shipZip").value = a.zip || "";
          } catch (_) {}
        });
      }
    }

    document.getElementById("placeOrderBtn").addEventListener("click", async () => {
      const cart = getCart();
      if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
      }
      const hasPOD = cart.some((i) => i.printData && Object.keys(i.printData).length);
      const proofCheck = document.getElementById("proofApproved");
      if (hasPOD && proofCheck && !proofCheck.checked) {
        alert("Please review the print proof above and check \"Proof approved\" before placing your order.");
        return;
      }
      if (window.shippingEnabled !== false) {
        if (!window.selectedShipping || !window.shippingRatesCache || !window.shippingRatesCache.length) {
          alert("Please click Get shipping rates and select a shipping option before submitting your order.");
          return;
        }
      }
      const billingOpts = Array.isArray(window.STORE_BILLING_OPTIONS) ? window.STORE_BILLING_OPTIONS : [];
      if (billingOpts.length > 0) {
        const b = getBillingSelectionForOrder();
        if (!b) {
          alert("Please select a billing option.");
          return;
        }
      }
      const name = document.getElementById("shipName").value.trim();
      const address1 = document.getElementById("shipAddress1").value.trim();
      const city = document.getElementById("shipCity").value.trim();
      const state = document.getElementById("shipState").value.trim();
      const zip = document.getElementById("shipZip").value.trim();
      if (!name || !address1 || !city || !state || !zip) {
        alert("Please fill in name, address, city, state, and ZIP.");
        return;
      }
      const btn = document.getElementById("placeOrderBtn");
      btn.disabled = true;
      btn.textContent = "Placing order…";
      try {
        const body = {
            deploymentSlug: window.STORE_SLUG || undefined,
            shipping: {
              name,
              company: document.getElementById("shipCompany").value.trim() || null,
              address1,
              address2: document.getElementById("shipAddress2").value.trim() || null,
              city,
              state,
              zip,
            },
            customerPhone: document.getElementById("customerPhone").value.trim() || undefined,
            billingSelection: getBillingSelectionForOrder() || undefined,
            shippingCost: window.selectedShipping?.totalCharges ?? 0,
            shippingMethod: window.selectedShipping ? `${window.selectedShipping.serviceName} (${window.selectedShipping.serviceCode})` : null,
            items: cart.map((i) => ({
              productId: i.productId,
              quantity: i.quantity || 1,
              ...(i.printData && Object.keys(i.printData).length ? { printData: i.printData } : {}),
              ...(i.rushFee != null && Number(i.rushFee) > 0 && i.rushSelected ? { rush: true } : {}),
            })),
          };
        const res = await fetch("/api/customer/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = data.message || "Order failed";
          if (msg.includes("Out of stock")) {
            alert(msg + "\n\nPlease remove out-of-stock items from your cart and try again.");
          } else {
            throw new Error(msg);
          }
          return;
        }
        setCart([]);
        window.location.href = (window.STORE_BASE || "/store") + "/orders?placed=1";
      } catch (e) {
        alert("Error: " + (e.message || "Could not place order"));
      } finally {
        btn.disabled = false;
        const pod = getCart().some((i) => i.printData && Object.keys(i.printData).length);
        btn.textContent = pod ? "Submit for Approval" : "Place your order";
      }
    });

    document.getElementById("getRatesBtn")?.addEventListener("click", fetchShippingRates);

    document.getElementById("cartLogout")?.addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = (window.STORE_BASE || "/store") + "/login";
    });

    render();
    document.getElementById("loading").style.display = "none";
    document.getElementById("cartCount").textContent = getCart().reduce((s, i) => s + (i.quantity || 1), 0);
  </script>
</body>
</html>
