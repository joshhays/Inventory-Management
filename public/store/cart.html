<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Store</title>
  <link rel="stylesheet" href="/styles.css">
  <script>var _b="__STORE_BASE__",_s="__STORE_SLUG__";if(!_b||_b.indexOf("__")===0){var m=location.pathname.match(/^\/store\/([^/]+)/);window.STORE_BASE=m?"/store/"+m[1]:"/store";window.STORE_SLUG=m?m[1]:null;}else{window.STORE_BASE=_b;window.STORE_SLUG=_s;}window.STORE_CART_KEY=window.STORE_SLUG?"storeCart_"+window.STORE_SLUG:"storeCart";</script>
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple store-nav">
      <a href="__STORE_BASE__/" class="top-nav-back">← Continue shopping</a>
      <a href="__STORE_BASE__/" class="top-nav-brand nav-logo-wrap"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSIzNiIgdmlld0JveD0iMCAwIDgwIDM2Ij48cmVjdCB3aWR0aD0iODAiIGhlaWdodD0iMzYiIGZpbGw9IiNmMWY1ZjkiIHJ4PSI2Ii8+PHRleHQgeD0iNDAiIHk9IjIyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNjQ3NDhiIiBmb250LXNpemU9IjEyIiBmb250LWZhbWlseT0ic3lzdGVtLXVpLHNhbnMtc2VyaWYiPlN0b3JlPC90ZXh0Pjwvc3ZnPg==" alt="Store" class="nav-logo"></a>
      <div class="store-nav-right">
        <a href="__STORE_BASE__/cart" class="store-cart-link store-cart-link-active">Cart (<span id="cartCount">0</span>)</a>
        <a href="__STORE_BASE__/orders" class="store-orders-link">My Orders</a>
        <a href="__STORE_BASE__/settings" class="store-settings-link" title="Settings">⚙ Settings</a>
        <a href="#" id="cartLogout" class="top-nav-back">Log out</a>
      </div>
    </header>
    <main class="main-content store-cart-main">
      <div id="cartContent">
        <div class="loading" id="loading">Loading…</div>
      </div>
      <aside id="checkoutSidebar" class="store-checkout-sidebar" style="display:none">
        <div class="store-checkout-box">
          <h2 class="store-checkout-title">Order summary</h2>
          <div id="orderSummary" class="store-order-summary"></div>
          <div class="store-checkout-divider"></div>
          <div class="store-form-row">
            <label for="savedAddress">Saved address</label>
            <select id="savedAddress">
              <option value="">-- Enter new or select --</option>
            </select>
          </div>
          <div class="store-shipping-form">
            <div class="store-form-row">
              <label for="shipName">Full name</label>
              <input type="text" id="shipName" placeholder="John Doe">
            </div>
            <div class="store-form-row">
              <label for="shipCompany">Company (optional)</label>
              <input type="text" id="shipCompany" placeholder="Acme Inc">
            </div>
            <div class="store-form-row">
              <label for="shipAddress1">Address line 1</label>
              <input type="text" id="shipAddress1" placeholder="123 Main St">
            </div>
            <div class="store-form-row">
              <label for="shipAddress2">Address line 2 (optional)</label>
              <input type="text" id="shipAddress2" placeholder="Apt 4, Suite 100">
            </div>
            <div class="store-form-row store-form-row-inline">
              <div>
                <label for="shipCity">City</label>
                <input type="text" id="shipCity" placeholder="Chicago">
              </div>
              <div>
                <label for="shipState">State</label>
                <input type="text" id="shipState" placeholder="IL">
              </div>
              <div>
                <label for="shipZip">ZIP</label>
                <input type="text" id="shipZip" placeholder="60601">
              </div>
            </div>
          </div>
          <div class="store-form-row">
            <label for="customerPhone">Phone (optional)</label>
            <input type="tel" id="customerPhone" placeholder="For delivery updates">
          </div>
          <button type="button" class="btn-apply store-place-order" id="placeOrderBtn">
            Place your order
          </button>
        </div>
      </aside>
    </main>
  </div>
  <script>
    function escape(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function formatPrice(n) {
      return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem(window.STORE_CART_KEY || "storeCart") || "[]");
      } catch {
        return [];
      }
    }

    function setCart(cart) {
      localStorage.setItem(window.STORE_CART_KEY || "storeCart", JSON.stringify(cart));
      const count = cart.reduce((s, i) => s + (i.quantity || 1), 0);
      const el = document.getElementById("cartCount");
      if (el) el.textContent = count;
    }

    function updateQty(productId, delta) {
      const cart = getCart();
      const item = cart.find((i) => i.productId === productId);
      if (!item) return;
      item.quantity = Math.max(0, (item.quantity || 1) + delta);
      if (item.quantity <= 0) {
        cart.splice(cart.indexOf(item), 1);
      }
      setCart(cart);
      render();
    }

    function render() {
      const cart = getCart();
      const content = document.getElementById("cartContent");
      const sidebar = document.getElementById("checkoutSidebar");
      const summaryEl = document.getElementById("orderSummary");

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="store-cart-empty">
            <h2>Your cart is empty</h2>
            <p>Add items from the store to get started.</p>
            <a href="__STORE_BASE__/" class="btn-apply store-cart-empty-btn">Continue shopping</a>
          </div>
        `;
        sidebar.style.display = "none";
        return;
      }

      const total = cart.reduce((s, i) => s + (i.price || 0) * (i.quantity || 1), 0);
      const itemCount = cart.reduce((s, i) => s + (i.quantity || 1), 0);

      content.innerHTML = `
        <h1 class="store-cart-heading">Shopping cart</h1>
        <p class="store-cart-subheading">${itemCount} ${itemCount === 1 ? "item" : "items"}</p>
        <div class="store-cart-items">
          ${cart
            .map(
              (i, idx) => `
            <div class="store-cart-card" data-id="${i.productId}">
              <div class="store-cart-card-img">
                ${i.imageUrl
                  ? '<img src="' + (i.imageUrl || '').replace(/"/g, '&quot;') + '" alt="" loading="lazy">'
                  : '<div class="store-cart-card-placeholder"><span>📦</span></div>'}
              </div>
              <div class="store-cart-card-body">
                <h3 class="store-cart-card-title">${escape(i.name)}</h3>
                ${i.printData && Object.keys(i.printData).length ? "<p class=\"store-cart-card-print\">Custom print: " + escape(Object.values(i.printData).filter(Boolean).join(", ") || "—") + "</p>" : ""}
                <p class="store-cart-card-sku">SKU: ${escape(i.sku)}</p>
                <p class="store-cart-card-price">$${formatPrice(i.price)}</p>
                <div class="store-cart-card-actions">
                  <div class="store-cart-qty-wrap">
                    <button type="button" class="store-cart-qty-btn" data-id="${i.productId}" data-delta="-1" aria-label="Decrease">−</button>
                    <span class="store-cart-qty-val">${i.quantity || 1}</span>
                    <button type="button" class="store-cart-qty-btn" data-id="${i.productId}" data-delta="1" aria-label="Increase">+</button>
                  </div>
                  <button type="button" class="store-cart-delete" data-id="${i.productId}">Delete</button>
                </div>
                ${i.printData && Object.keys(i.printData).length ? `<div class="store-cart-pod-preview" data-cart-index="${idx}" aria-live="polite"><div class="store-cart-pod-preview-loading">Loading final preview…</div></div>` : ""}
              </div>
              <div class="store-cart-card-total">
                $${formatPrice((i.price || 0) * (i.quantity || 1))}
              </div>
            </div>
          `
            )
            .join("")}
        </div>
      `;

      summaryEl.innerHTML = `
        <div class="store-summary-row">
          <span>Subtotal (${itemCount} ${itemCount === 1 ? "item" : "items"})</span>
          <span>$${formatPrice(total)}</span>
        </div>
        <div class="store-summary-row store-summary-total">
          <span>Order total</span>
          <span>$${formatPrice(total)}</span>
        </div>
      `;

      sidebar.style.display = "block";
      loadSavedAddresses();

      content.querySelectorAll(".store-cart-qty-btn").forEach((btn) => {
        btn.addEventListener("click", () => updateQty(Number(btn.dataset.id), Number(btn.dataset.delta)));
      });
      content.querySelectorAll(".store-cart-delete").forEach((btn) => {
        btn.addEventListener("click", () => updateQty(Number(btn.dataset.id), -999));
      });

      loadCartPODPreviews(cart, content);
    }

    const cartPODBlobUrls = [];
    function revokeCartPODBlobUrls() {
      cartPODBlobUrls.forEach((u) => URL.revokeObjectURL(u));
      cartPODBlobUrls.length = 0;
    }

    async function loadCartPODPreviews(cart, content) {
      revokeCartPODBlobUrls();
      for (let idx = 0; idx < cart.length; idx++) {
        const item = cart[idx];
        if (!item.printData || !Object.keys(item.printData).length) continue;
        const container = content.querySelector(".store-cart-pod-preview[data-cart-index=\"" + idx + "\"]");
        if (!container) continue;
        try {
          const res = await fetch("/api/pod/preview", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(item.printData),
          });
          if (!res.ok) {
            let msg = "Preview unavailable";
            const ct = res.headers.get("Content-Type") || "";
            if (ct.includes("application/json")) {
              try {
                const data = await res.json();
                if (data.message) msg = data.message;
              } catch (_) {}
            }
            throw new Error(msg);
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          cartPODBlobUrls.push(url);
          container.innerHTML = "<p class=\"store-cart-pod-preview-label\">Final product for review</p><iframe class=\"store-cart-pod-iframe\" src=\"" + url.replace(/"/g, "&quot;") + "\" title=\"Print preview\"></iframe>";
        } catch (e) {
          const p = document.createElement("p");
          p.className = "store-cart-pod-preview-error";
          p.textContent = e.message || "Preview unavailable";
          container.innerHTML = "";
          container.appendChild(p);
        }
      }
    }

    let savedAddressesBound = false;
    async function loadSavedAddresses() {
      const sel = document.getElementById("savedAddress");
      if (!sel) return;
      sel.innerHTML = '<option value="">-- Enter new or select --</option>';
      try {
        const res = await fetch("/api/customer/addresses", { credentials: "include" });
        if (!res.ok) return;
        const data = await res.json();
        const addrs = data.addresses || [];
        addrs.forEach((a) => {
          const opt = document.createElement("option");
          opt.value = JSON.stringify(a);
          opt.textContent = a.label + " - " + a.address1 + ", " + a.city;
          sel.appendChild(opt);
        });
      } catch (_) {}
      if (!savedAddressesBound) {
        savedAddressesBound = true;
        sel.addEventListener("change", () => {
          const val = sel.value;
          if (!val) return;
          try {
            const a = JSON.parse(val);
            document.getElementById("shipName").value = a.name || "";
            document.getElementById("shipCompany").value = a.company || "";
            document.getElementById("shipAddress1").value = a.address1 || "";
            document.getElementById("shipAddress2").value = a.address2 || "";
            document.getElementById("shipCity").value = a.city || "";
            document.getElementById("shipState").value = a.state || "";
            document.getElementById("shipZip").value = a.zip || "";
          } catch (_) {}
        });
      }
    }

    document.getElementById("placeOrderBtn").addEventListener("click", async () => {
      const cart = getCart();
      if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
      }
      const name = document.getElementById("shipName").value.trim();
      const address1 = document.getElementById("shipAddress1").value.trim();
      const city = document.getElementById("shipCity").value.trim();
      const state = document.getElementById("shipState").value.trim();
      const zip = document.getElementById("shipZip").value.trim();
      if (!name || !address1 || !city || !state || !zip) {
        alert("Please fill in name, address, city, state, and ZIP.");
        return;
      }
      const btn = document.getElementById("placeOrderBtn");
      btn.disabled = true;
      btn.textContent = "Placing order…";
      try {
        const body = {
            deploymentSlug: window.STORE_SLUG || undefined,
            shipping: {
              name,
              company: document.getElementById("shipCompany").value.trim() || null,
              address1,
              address2: document.getElementById("shipAddress2").value.trim() || null,
              city,
              state,
              zip,
            },
            customerPhone: document.getElementById("customerPhone").value.trim() || undefined,
            items: cart.map((i) => ({
              productId: i.productId,
              quantity: i.quantity || 1,
              ...(i.printData && Object.keys(i.printData).length ? { printData: i.printData } : {}),
            })),
          };
        const res = await fetch("/api/customer/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = data.message || "Order failed";
          if (msg.includes("Out of stock")) {
            alert(msg + "\n\nPlease remove out-of-stock items from your cart and try again.");
          } else {
            throw new Error(msg);
          }
          return;
        }
        setCart([]);
        window.location.href = (window.STORE_BASE || "/store") + "/orders?placed=1";
      } catch (e) {
        alert("Error: " + (e.message || "Could not place order"));
      } finally {
        btn.disabled = false;
        btn.textContent = "Place your order";
      }
    });

    document.getElementById("cartLogout")?.addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = (window.STORE_BASE || "/store") + "/login";
    });

    render();
    document.getElementById("loading").style.display = "none";
    document.getElementById("cartCount").textContent = getCart().reduce((s, i) => s + (i.quantity || 1), 0);
  </script>
</body>
</html>
