<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Approvals - Store</title>
  <link rel="stylesheet" href="/styles.css">
  <script>var _b="__STORE_BASE__",_s="__STORE_SLUG__";if(!_b||_b.indexOf("__")===0){var m=location.pathname.match(/^\/store\/([^/]+)/);window.STORE_BASE=m?"/store/"+m[1]:"/store";window.STORE_SLUG=m?m[1]:null;}else{window.STORE_BASE=_b;window.STORE_SLUG=_s;}</script>
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple store-nav">
      <a href="__STORE_BASE__/" class="top-nav-back">← Products</a>
      <a href="__STORE_BASE__/" class="top-nav-brand nav-logo-wrap"><img src="__STORE_LOGO__" alt="Store" class="nav-logo"></a>
      <div class="store-nav-right">
        <span class="top-nav-brand">Order Approvals</span>
        <a href="__STORE_BASE__/orders" class="top-nav-back">My Orders</a>
        <a href="__STORE_BASE__/cart" class="store-cart-link">Cart</a>
        <a href="__STORE_BASE__/settings" class="store-settings-link" title="Settings">⚙ Settings</a>
        <a href="#" id="approvalsLogout" class="top-nav-back">Log out</a>
      </div>
    </header>
    <main class="main-content store-main">
      <h1>Pending Approvals</h1>
      <p class="approvals-hint">Orders with custom print-on-demand items awaiting approval. Review the PDF proof, then approve or reject.</p>
      <div id="approvalsContent">
        <div class="loading" id="loading">Loading…</div>
      </div>
    </main>
  </div>
  <script>
    function escape(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function formatPrice(n) {
      return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function load() {
      const content = document.getElementById("approvalsContent");
      const loading = document.getElementById("loading");
      if (!window.STORE_SLUG) {
        loading.style.display = "none";
        content.innerHTML = '<p class="store-empty error">Store not found.</p>';
        return;
      }
      try {
        const res = await fetch("/api/customer/pending-approvals?deployment=" + encodeURIComponent(window.STORE_SLUG), {
          credentials: "include",
        });
        loading.style.display = "none";
        if (res.status === 401) {
          window.location.href = (window.STORE_BASE || "/store") + "/login?next=" + encodeURIComponent("/approvals");
          return;
        }
        if (res.status === 403) {
          content.innerHTML = '<p class="store-empty error">You do not have permission to approve orders. Contact your administrator to be added to the approvers group.</p>';
          return;
        }
        if (!res.ok) throw new Error("Failed to load");
        const { orders } = await res.json();
        if (!orders || orders.length === 0) {
          content.innerHTML = '<p class="store-empty">No orders pending approval.</p>';
          return;
        }
        const html = `
          <div class="table-wrap">
            <table class="store-orders-table orders-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Order #</th>
                  <th>Customer</th>
                  <th class="num">Total</th>
                  <th>Proof</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${orders.map((o) => {
                  const proofs = o.proofUrls || [];
                  const proofHtml = proofs.length
                    ? proofs.map((p) => `
                        <div class="approval-proof-block">
                          <span class="approval-proof-label">${escape(p.productName || "Item #" + p.itemId)}</span>
                          <iframe src="${escape(p.proofPdfUrl)}" title="Proof: ${escape(p.productName || o.customerName)}" class="approval-pdf-iframe"></iframe>
                        </div>
                      `).join("")
                    : "—";
                  return `
                    <tr data-id="${o.id}">
                      <td>${new Date(o.createdAt).toLocaleString()}</td>
                      <td>#${o.id}</td>
                      <td>${escape(o.customerName)}<br><small>${escape(o.customerEmail)}</small></td>
                      <td class="num">${formatPrice(o.total)}</td>
                      <td>${proofHtml}</td>
                      <td>
                        <button type="button" class="btn-create btn-approve" data-id="${o.id}">Approve</button>
                        <button type="button" class="btn-secondary btn-reject" data-id="${o.id}" style="margin-left:0.5rem">Reject</button>
                      </td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
        content.innerHTML = html;

        content.querySelectorAll(".btn-approve").forEach((btn) => {
          btn.addEventListener("click", () => approveOrder(Number(btn.dataset.id)));
        });
        content.querySelectorAll(".btn-reject").forEach((btn) => {
          btn.addEventListener("click", () => rejectOrder(Number(btn.dataset.id)));
        });
      } catch (e) {
        content.innerHTML = `<p class="store-empty error">${escape(e.message || "Could not load approvals")}</p>`;
      }
    }

    async function approveOrder(orderId) {
      const btn = document.querySelector(`.btn-approve[data-id="${orderId}"]`);
      if (btn) btn.disabled = true;
      try {
        const res = await fetch("/api/customer/orders/" + orderId + "/approve?deployment=" + encodeURIComponent(window.STORE_SLUG), {
          method: "POST",
          credentials: "include",
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || "Approval failed");
        await load();
      } catch (e) {
        alert(e.message || "Failed to approve order");
        if (btn) btn.disabled = false;
      }
    }

    async function rejectOrder(orderId) {
      const btn = document.querySelector(`.btn-reject[data-id="${orderId}"]`);
      if (btn) btn.disabled = true;
      try {
        const res = await fetch("/api/customer/orders/" + orderId + "/reject?deployment=" + encodeURIComponent(window.STORE_SLUG), {
          method: "POST",
          credentials: "include",
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || "Reject failed");
        await load();
      } catch (e) {
        alert(e.message || "Failed to reject order");
        if (btn) btn.disabled = false;
      }
    }

    document.getElementById("approvalsLogout")?.addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = (window.STORE_BASE || "/store") + "/login";
    });

    load();
  </script>
  <style>
    .approvals-hint { color: var(--text-muted); margin-bottom: 1rem; font-size: 0.95rem; }
    .btn-approve { font-size: 0.9rem; padding: 0.4rem 0.75rem; }
    .btn-reject { font-size: 0.9rem; padding: 0.4rem 0.75rem; }
    .approval-proof-block { margin-bottom: 0.75rem; }
    .approval-proof-block:last-child { margin-bottom: 0; }
    .approval-proof-label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.35rem; }
    .approval-pdf-iframe { width: 100%; min-width: 200px; height: 220px; border: 1px solid #e2e8f0; border-radius: 6px; }
  </style>
</body>
</html>
