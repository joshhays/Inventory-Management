<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Store</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple store-nav">
      <a href="/store/" class="top-nav-back">← Products</a>
      <span class="top-nav-brand">My Orders</span>
      <a href="/store/cart.html" class="top-nav-back">Cart</a>
    </header>
    <main class="main-content store-main">
      <div id="ordersContent">
        <div class="loading" id="loading">Loading…</div>
      </div>
    </main>
  </div>
  <script>
    function escape(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function formatPrice(n) {
      return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    const params = new URLSearchParams(location.search);
    if (params.get("placed") === "1") {
      const msg = document.createElement("p");
      msg.className = "store-success";
      msg.textContent = "Order placed successfully!";
      document.getElementById("ordersContent").appendChild(msg);
    }

    async function load() {
      try {
        const res = await fetch("/api/customer/orders", { credentials: "include" });
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = "/store/login.html";
            return;
          }
          throw new Error("Failed to load orders");
        }
        const data = await res.json();
        document.getElementById("loading").style.display = "none";
        const orders = data.orders || [];
        if (orders.length === 0) {
          document.getElementById("ordersContent").innerHTML +=
            '<p class="store-empty">No orders yet. <a href="/store/">Start shopping</a></p>';
          return;
        }
        const html = `
          <table class="store-orders-table">
            <thead>
              <tr><th>Date</th><th>Order #</th><th>Items</th><th class="num">Total</th><th>Status</th></tr>
            </thead>
            <tbody>
              ${orders
                .map(
                  (o) => `
                <tr>
                  <td>${new Date(o.createdAt).toLocaleDateString()}</td>
                  <td>#${o.id}</td>
                  <td>${(o.items || []).map((i) => `${i.quantity}× ${escape(i.productName)}`).join(", ")}</td>
                  <td class="num">$${formatPrice(o.total)}</td>
                  <td><span class="store-status store-status-${escape(o.status)}">${escape(o.status)}</span></td>
                </tr>
              `
                )
                .join("")}
            </tbody>
          </table>
        `;
        document.getElementById("ordersContent").innerHTML += html;
      } catch (e) {
        document.getElementById("ordersContent").innerHTML = `<p class="store-empty error">${escape(e.message)}</p>`;
      }
    }

    load();
  </script>
</body>
</html>
