<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Store</title>
  <link rel="stylesheet" href="/styles.css">
  <script>var _b="__STORE_BASE__",_s="__STORE_SLUG__";if(!_b||_b.indexOf("__")===0){var m=location.pathname.match(/^\/store\/([^/]+)/);window.STORE_BASE=m?"/store/"+m[1]:"/store";window.STORE_SLUG=m?m[1]:null;}else{window.STORE_BASE=_b;window.STORE_SLUG=_s;}window.STORE_CART_KEY=window.STORE_SLUG?"storeCart_"+window.STORE_SLUG:"storeCart";</script>
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple store-nav">
      <a href="__STORE_BASE__/" class="top-nav-back">← Products</a>
      <a href="__STORE_BASE__/" class="top-nav-brand nav-logo-wrap"><img src="__STORE_LOGO__" alt="Store" class="nav-logo"></a>
      <div class="store-nav-right">
        <span class="top-nav-brand">My Orders</span>
        <a href="__STORE_BASE__/cart" class="store-cart-link">Cart</a>
        <a href="__STORE_BASE__/settings" class="store-settings-link" title="Settings">⚙ Settings</a>
        <a href="#" id="ordersLogout" class="top-nav-back">Log out</a>
      </div>
    </header>
    <main class="main-content store-main">
      <div id="ordersContent">
        <div class="loading" id="loading">Loading…</div>
      </div>
    </main>
  </div>
  <script>
    function escape(s) {
      const div = document.createElement("div");
      div.textContent = s ?? "";
      return div.innerHTML;
    }

    function formatPrice(n) {
      return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    const params = new URLSearchParams(location.search);
    if (params.get("placed") === "1") {
      const msg = document.createElement("p");
      msg.className = "store-success";
      msg.textContent = "Order placed successfully!";
      document.getElementById("ordersContent").appendChild(msg);
    }

    async function load() {
      try {
        const ordersUrl = "/api/customer/orders" + (window.STORE_SLUG ? "?deployment=" + encodeURIComponent(window.STORE_SLUG) : "");
        const res = await fetch(ordersUrl, { credentials: "include" });
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = (window.STORE_BASE || "/store") + "/login";
            return;
          }
          throw new Error("Failed to load orders");
        }
        const data = await res.json();
        document.getElementById("loading").style.display = "none";
        const orders = data.orders || [];
        if (orders.length === 0) {
          document.getElementById("ordersContent").innerHTML +=
            '<p class="store-empty">No orders yet. <a href="' + (window.STORE_BASE || "/store") + '/">Start shopping</a></p>';
          return;
        }
        const html = `
          <table class="store-orders-table">
            <thead>
              <tr><th>Date</th><th>Order #</th><th>Items</th><th class="num">Total</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
              ${orders
                .map(
                  (o) => `
                <tr data-order-id="${o.id}">
                  <td>${new Date(o.createdAt).toLocaleDateString()}</td>
                  <td>#${o.id}</td>
                  <td>${(o.items || []).map((i) => `${i.quantity}× ${escape(i.productName)}`).join(", ")}</td>
                  <td class="num">$${formatPrice(o.total)}</td>
                  <td><span class="store-status store-status-${escape(String(o.status).replace(/\s+/g, "-"))}">${escape(o.status)}</span></td>
                  <td><button type="button" class="btn-reorder" data-order-id="${o.id}">Re-order</button></td>
                </tr>
              `
                )
                .join("")}
            </tbody>
          </table>
        `;
        document.getElementById("ordersContent").innerHTML += html;

        function getCart() {
          try {
            return JSON.parse(localStorage.getItem(window.STORE_CART_KEY || "storeCart") || "[]");
          } catch {
            return [];
          }
        }

        function setCart(cart) {
          localStorage.setItem(window.STORE_CART_KEY || "storeCart", JSON.stringify(cart));
        }

        function reorder(order) {
          const items = order.items || [];
          if (items.length === 0) {
            alert("This order has no items.");
            return;
          }
          const cart = getCart();
          for (const i of items) {
            const existing = cart.find((c) => c.productId === i.productId);
            const qty = i.quantity || 1;
            const cartItem = {
              productId: i.productId,
              quantity: qty,
              name: i.productName || "Product",
              price: i.unitPrice ?? 0,
              sku: i.sku || "",
              imageUrl: null,
            };
            if (existing) {
              existing.quantity = (existing.quantity || 1) + qty;
            } else {
              cart.push(cartItem);
            }
          }
          setCart(cart);
          window.location.href = (window.STORE_BASE || "/store") + "/cart";
        }

        document.querySelectorAll(".btn-reorder").forEach((btn) => {
          btn.addEventListener("click", () => {
            const orderId = Number(btn.dataset.orderId);
            const order = orders.find((o) => o.id === orderId);
            if (order) reorder(order);
          });
        });
      } catch (e) {
        document.getElementById("ordersContent").innerHTML = `<p class="store-empty error">${escape(e.message)}</p>`;
      }
    }

    document.getElementById("ordersLogout")?.addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
          window.location.href = (window.STORE_BASE || "/store") + "/login";
    });

    load();
  </script>
</body>
</html>
