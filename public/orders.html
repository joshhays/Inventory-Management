<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Inventory</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="prefetch" href="/">
  <link rel="prefetch" href="/products-manage.html">
  <link rel="prefetch" href="/logs.html">
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple">
      <a href="/" class="top-nav-back">← Dashboard</a>
      <a href="/" class="top-nav-brand nav-logo-wrap"><img src="/logo.png" alt="Inventory" class="nav-logo"></a>
    </header>
    <main class="main-content">
      <h1>Orders</h1>
      <div class="orders-toolbar">
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="shipped">Shipped</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <select id="pageSize">
          <option value="25">25 per page</option>
          <option value="50" selected>50 per page</option>
          <option value="100">100 per page</option>
        </select>
      </div>
      <div class="table-wrap">
        <div class="empty" id="loading">Loading…</div>
        <table class="orders-table" id="ordersTable" style="display:none">
          <thead>
            <tr>
              <th>Date</th>
              <th>Order #</th>
              <th>Customer</th>
              <th>Email</th>
              <th>Items</th>
              <th class="num">Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination" style="display:none">
        <span class="pagination-info" id="paginationInfo"></span>
        <button id="prevBtn">Previous</button>
        <div class="page-nums" id="pageNums"></div>
        <button id="nextBtn">Next</button>
      </div>
    </main>
  </div>
  <div class="order-detail-overlay" id="orderDetailOverlay"></div>
  <aside class="order-detail-sidebar" id="orderDetailSidebar">
    <h3 id="orderDetailTitle">Order #</h3>
    <div class="detail-section">
      <label>Customer</label>
      <p id="orderDetailCustomer"></p>
    </div>
    <div class="detail-section">
      <label>Email</label>
      <p id="orderDetailEmail"></p>
    </div>
    <div class="detail-section" id="orderDetailPhoneWrap">
      <label>Phone</label>
      <p id="orderDetailPhone"></p>
    </div>
    <div class="detail-section" id="orderDetailAddressWrap">
      <label>Shipping Address</label>
      <p id="orderDetailAddress"></p>
    </div>
    <div class="detail-section">
      <label>Status</label>
      <select id="orderDetailStatus" class="status-select">
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="shipped">Shipped</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <div class="detail-section">
      <label>Items</label>
      <table class="items-table" id="orderDetailItems">
        <thead><tr><th>SKU</th><th>Product</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="detail-section">
      <label>Total</label>
      <p id="orderDetailTotal" style="font-weight:600; font-size:1rem;"></p>
    </div>
    <button class="btn-close" id="btnCloseOrderDetail">Close</button>
  </aside>
  <script>
    const statusFilter = document.getElementById("statusFilter");
    const pageSize = document.getElementById("pageSize");
    const loading = document.getElementById("loading");
    const ordersTable = document.getElementById("ordersTable");
    const ordersBody = document.getElementById("ordersBody");
    const pagination = document.getElementById("pagination");
    const paginationInfo = document.getElementById("paginationInfo");
    const pageNums = document.getElementById("pageNums");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const orderDetailSidebar = document.getElementById("orderDetailSidebar");
    const orderDetailOverlay = document.getElementById("orderDetailOverlay");

    let currentPage = 1;
    let selectedOrderId = null;

    async function loadOrders(page = 1) {
      currentPage = page;
      loading.style.display = "block";
      ordersTable.style.display = "none";
      pagination.style.display = "none";
      const params = new URLSearchParams();
      if (statusFilter.value) params.set("status", statusFilter.value);
      params.set("page", page);
      params.set("limit", pageSize.value);
      try {
        const res = await fetch("/api/orders?" + params);
        const data = await res.json();
        const { orders, total, page: p, limit, totalPages } = data;
        if (orders.length === 0) {
          loading.textContent = "No orders yet.";
          loading.style.display = "block";
        } else {
          loading.style.display = "none";
          ordersTable.style.display = "table";
          ordersBody.innerHTML = orders.map(o => {
            const itemCount = o.items?.reduce((s, i) => s + i.quantity, 0) || 0;
            return `
              <tr data-id="${o.id}">
                <td>${new Date(o.createdAt).toLocaleString()}</td>
                <td>#${o.id}</td>
                <td>${escapeHtml(o.customerName)}</td>
                <td>${escapeHtml(o.customerEmail)}</td>
                <td>${itemCount}</td>
                <td class="num">${formatPrice(o.total)}</td>
                <td><span class="badge badge-${o.status}">${o.status}</span></td>
              </tr>
            `;
          }).join("");
          ordersBody.querySelectorAll("tr").forEach(tr => {
            tr.addEventListener("click", () => openOrderDetail(Number(tr.dataset.id)));
          });
          const start = (p - 1) * limit + 1;
          const end = Math.min(p * limit, total);
          paginationInfo.textContent = `Showing ${start}–${end} of ${total}`;
          prevBtn.disabled = p <= 1;
          nextBtn.disabled = p >= totalPages;
          prevBtn.onclick = () => loadOrders(p - 1);
          nextBtn.onclick = () => loadOrders(p + 1);
          pageNums.innerHTML = "";
          const maxVisible = 5;
          let from = Math.max(1, p - Math.floor(maxVisible / 2));
          let to = Math.min(totalPages, from + maxVisible - 1);
          if (to - from < maxVisible - 1) from = Math.max(1, to - maxVisible + 1);
          for (let i = from; i <= to; i++) {
            const btn = document.createElement("button");
            btn.textContent = i;
            if (i === p) btn.classList.add("active");
            btn.onclick = () => loadOrders(i);
            pageNums.appendChild(btn);
          }
          pagination.style.display = "flex";
        }
      } catch (e) {
        loading.textContent = "Error: " + e.message;
        loading.className = "empty error";
      }
    }

    async function openOrderDetail(id) {
      selectedOrderId = id;
      try {
        const res = await fetch(`/api/orders/${id}`);
        const order = await res.json();
        if (!res.ok) throw new Error(order.message || "Failed to load");
        document.getElementById("orderDetailTitle").textContent = `Order #${order.id}`;
        document.getElementById("orderDetailCustomer").textContent = order.customerName;
        document.getElementById("orderDetailEmail").textContent = order.customerEmail;
        document.getElementById("orderDetailPhone").textContent = order.customerPhone || "—";
        document.getElementById("orderDetailAddress").textContent = order.shippingAddress || "—";
        document.getElementById("orderDetailStatus").value = order.status;
        document.getElementById("orderDetailTotal").textContent = formatPrice(order.total);
        const tbody = document.querySelector("#orderDetailItems tbody");
        tbody.innerHTML = (order.items || []).map(i => `
          <tr>
            <td>${escapeHtml(i.sku)}</td>
            <td>${escapeHtml(i.productName)}</td>
            <td class="num">${i.quantity}</td>
            <td class="num">${formatPrice(i.unitPrice)}</td>
            <td class="num">${formatPrice(i.lineTotal)}</td>
          </tr>
        `).join("");
        orderDetailSidebar.classList.add("open");
        orderDetailOverlay.classList.add("open");
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    function closeOrderDetail() {
      orderDetailSidebar.classList.remove("open");
      orderDetailOverlay.classList.remove("open");
      selectedOrderId = null;
    }

    document.getElementById("btnCloseOrderDetail").addEventListener("click", closeOrderDetail);
    orderDetailOverlay.addEventListener("click", closeOrderDetail);

    document.getElementById("orderDetailStatus").addEventListener("change", async (e) => {
      if (!selectedOrderId) return;
      const status = e.target.value;
      try {
        const res = await fetch(`/api/orders/${selectedOrderId}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status }),
        });
        if (!res.ok) throw new Error((await res.json()).message || res.statusText);
        loadOrders(currentPage);
        document.getElementById("orderDetailStatus").value = status;
      } catch (err) {
        alert("Error: " + err.message);
      }
    });

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s || "";
      return div.innerHTML;
    }

    function formatPrice(n) {
      return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    statusFilter.addEventListener("change", () => loadOrders(1));
    pageSize.addEventListener("change", () => loadOrders(1));

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && orderDetailSidebar.classList.contains("open")) closeOrderDetail();
    });

    loadOrders(1);
  </script>
</body>
</html>
