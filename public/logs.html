<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Log - Inventory</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-header-text">Inventory</span>
        <button class="collapse-btn" id="collapseBtn" aria-label="Collapse sidebar" title="Collapse">‹</button>
      </div>
      <nav class="sidebar-nav">
        <a href="/"><span>Products</span></a>
        <a href="/products-manage.html"><span>Manage Products</span></a>
        <a href="/orders.html"><span>Orders</span></a>
        <a href="/logs.html" class="active"><span>Transaction Log</span></a>
      </nav>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu"><span></span></button>
    <main class="main-content">
      <h1>Transaction Log</h1>
      <div class="logs-toolbar">
        <input type="search" id="searchInput" placeholder="Search SKU or product name...">
        <select id="actionFilter">
          <option value="">All actions</option>
        </select>
        <select id="pageSize">
          <option value="25">25 per page</option>
          <option value="50" selected>50 per page</option>
          <option value="100">100 per page</option>
        </select>
        <button id="searchBtn">Search</button>
      </div>
      <div class="logs-table-wrap">
        <div class="empty" id="loading">Loading…</div>
        <table class="logs-table" id="logsTable" style="display:none">
          <thead>
            <tr>
              <th>Date</th>
              <th>SKU</th>
              <th>Product</th>
              <th>Action</th>
              <th class="num">Before</th>
              <th class="num">After</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody id="logsBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination" style="display:none">
        <span class="pagination-info" id="paginationInfo"></span>
        <button id="prevBtn">Previous</button>
        <div class="page-nums" id="pageNums"></div>
        <button id="nextBtn">Next</button>
      </div>
    </main>
  </div>
  <script>
    const searchInput = document.getElementById("searchInput");
    const actionFilter = document.getElementById("actionFilter");
    const pageSize = document.getElementById("pageSize");
    const searchBtn = document.getElementById("searchBtn");
    const loading = document.getElementById("loading");
    const logsTable = document.getElementById("logsTable");
    const logsBody = document.getElementById("logsBody");
    const pagination = document.getElementById("pagination");
    const paginationInfo = document.getElementById("paginationInfo");
    const pageNums = document.getElementById("pageNums");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentPage = 1;

    async function loadActions() {
      const res = await fetch("/api/logs/actions");
      const actions = await res.json();
      actionFilter.innerHTML = '<option value="">All actions</option>' + actions.map(a => `<option value="${a}">${a}</option>`).join("");
    }

    async function loadLogs(page = 1) {
      currentPage = page;
      loading.style.display = "block";
      logsTable.style.display = "none";
      pagination.style.display = "none";
      const params = new URLSearchParams();
      if (searchInput.value.trim()) params.set("search", searchInput.value.trim());
      if (actionFilter.value) params.set("action", actionFilter.value);
      params.set("page", page);
      params.set("limit", pageSize.value);
      try {
        const res = await fetch("/api/logs?" + params);
        const data = await res.json();
        const { logs, total, page: p, limit, totalPages } = data;
        if (logs.length === 0) {
          loading.textContent = "No transactions found.";
          loading.style.display = "block";
        } else {
          loading.style.display = "none";
          logsTable.style.display = "table";
          logsBody.innerHTML = logs.map(l => `
            <tr>
              <td>${new Date(l.createdAt).toLocaleString()}</td>
              <td>${escapeHtml(l.sku)}</td>
              <td>${escapeHtml(l.productName)}</td>
              <td><span class="badge badge-${l.action}">${l.action}</span></td>
              <td class="num">${l.quantityBefore}</td>
              <td class="num">${l.quantityAfter}</td>
              <td>${escapeHtml(l.source)}</td>
            </tr>
          `).join("");
          const start = (p - 1) * limit + 1;
          const end = Math.min(p * limit, total);
          paginationInfo.textContent = `Showing ${start}–${end} of ${total}`;
          prevBtn.disabled = p <= 1;
          nextBtn.disabled = p >= totalPages;
          prevBtn.onclick = () => loadLogs(p - 1);
          nextBtn.onclick = () => loadLogs(p + 1);
          pageNums.innerHTML = "";
          const maxVisible = 5;
          let from = Math.max(1, p - Math.floor(maxVisible / 2));
          let to = Math.min(totalPages, from + maxVisible - 1);
          if (to - from < maxVisible - 1) from = Math.max(1, to - maxVisible + 1);
          for (let i = from; i <= to; i++) {
            const btn = document.createElement("button");
            btn.textContent = i;
            if (i === p) btn.classList.add("active");
            btn.onclick = () => loadLogs(i);
            pageNums.appendChild(btn);
          }
          pagination.style.display = "flex";
        }
      } catch (e) {
        loading.textContent = "Error: " + e.message;
        loading.className = "empty error";
      }
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s || "";
      return div.innerHTML;
    }

    searchBtn.addEventListener("click", () => loadLogs(1));
    searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") loadLogs(1); });
    actionFilter.addEventListener("change", () => loadLogs(1));
    pageSize.addEventListener("change", () => loadLogs(1));

    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const menuBtn = document.getElementById("menuBtn");
    const collapseBtn = document.getElementById("collapseBtn");

    function toggleSidebar() { sidebar.classList.toggle("open"); sidebarOverlay.classList.toggle("open"); }
    function closeSidebar() { sidebar.classList.remove("open"); sidebarOverlay.classList.remove("open"); }
    menuBtn.addEventListener("click", toggleSidebar);
    sidebarOverlay.addEventListener("click", closeSidebar);

    if (localStorage.getItem("sidebar-collapsed") === "true") {
      sidebar.classList.add("collapsed");
      collapseBtn.textContent = "›";
      collapseBtn.title = "Expand";
    }
    collapseBtn.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
      const isCollapsed = sidebar.classList.contains("collapsed");
      collapseBtn.textContent = isCollapsed ? "›" : "‹";
      collapseBtn.title = isCollapsed ? "Expand" : "Collapse";
      localStorage.setItem("sidebar-collapsed", isCollapsed);
    });

    loadActions().then(() => loadLogs(1));
  </script>
</body>
</html>
