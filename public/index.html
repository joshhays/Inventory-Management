<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/deployment-header.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="prefetch" href="/products.html">
  <link rel="prefetch" href="/products-manage.html">
  <link rel="prefetch" href="/orders.html">
  <link rel="prefetch" href="/logs.html">
  <link rel="prefetch" href="/users.html">
  <link rel="prefetch" href="/groups.html">
  <link rel="prefetch" href="/deployments.html">
  <link rel="prefetch" href="/reports.html">
</head>
<body>
  <div class="app-layout">
    <header class="top-nav top-nav-simple">
      <a href="/" class="top-nav-brand nav-logo-wrap"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSIzNiIgdmlld0JveD0iMCAwIDgwIDM2Ij48cmVjdCB3aWR0aD0iODAiIGhlaWdodD0iMzYiIGZpbGw9IiNmMWY1ZjkiIHJ4PSI2Ii8+PHRleHQgeD0iNDAiIHk9IjIyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNjQ3NDhiIiBmb250LXNpemU9IjEyIiBmb250LWZhbWlseT0ic3lzdGVtLXVpLHNhbnMtc2VyaWYiPkludmVudG9yeTwvdGV4dD48L3N2Zz4=" alt="Inventory" class="nav-logo" id="navLogo"></a>
      <a href="/dashboard.html" class="top-nav-back" id="switchDeploymentLink" title="Switch deployment">Switch</a>
      <a href="#" id="logoutLink" class="top-nav-back">Log out</a>
    </header>
    <main class="main-content bento-main">
      <h1 class="bento-title">Dashboard</h1>
      <p class="board-hint">Drag items anywhere on the board. Positions are saved automatically.</p>
      <div class="dashboard-board" id="dashboardBoard">
        <div id="dashboardWidgets"></div>
        <div class="bento-cards-layer" id="bentoCardsLayer"></div>
      </div>
    </main>
  </div>
  <script>
    document.getElementById("logoutLink").addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = "/login.html";
    });

    const BOARD = document.getElementById("dashboardBoard");

    async function loadDashboardWidgets() {
      const el = document.getElementById("dashboardWidgets");
      if (!el) return;
      try {
        const res = await fetch("/api/dashboard-widgets", { credentials: "include" });
        if (!res.ok) return;
        const { widgets } = await res.json();
        el.innerHTML = "";
        const sizeHeights = { small: 150, medium: 200, large: 300 };
        (widgets || []).forEach((w) => {
          const size = w.size || "medium";
          const chartHeight = sizeHeights[size] || 200;
          const div = document.createElement("div");
          div.className = "dashboard-widget dashboard-widget-" + size + " board-item";
          div.dataset.id = w.id;
          div.draggable = true;
          div.style.left = (w.posX ?? 0) + "px";
          div.style.top = (w.posY ?? 0) + "px";
          div.innerHTML = `
            <span class="dashboard-widget-drag" title="Drag to move">⋮⋮</span>
            <div class="dashboard-widget-actions">
              <a href="/report-view.html?id=${w.id}" target="_blank" rel="noopener" class="dashboard-widget-open" title="Open in new page">Open</a>
              <button type="button" class="dashboard-widget-size" data-id="${w.id}" title="Resize">⤢</button>
              <button type="button" class="dashboard-widget-remove" data-id="${w.id}" title="Remove report">Remove</button>
            </div>
            <h3>${escapeHtml(w.title)}</h3>
            <div class="dashboard-widget-chart" style="height:${chartHeight}px"></div>
            <div class="dashboard-widget-table-wrap"></div>
          `;
          const chartEl = div.querySelector(".dashboard-widget-chart");
          const tableWrap = div.querySelector(".dashboard-widget-table-wrap");
          if (w.error) {
            chartEl.innerHTML = "<p style='color:var(--text-muted);font-size:0.9rem'>" + escapeHtml(w.error) + "</p>";
          } else {
            if (w.chartData && window.Chart) {
              const canvas = document.createElement("canvas");
              chartEl.appendChild(canvas);
              const ctx = canvas.getContext("2d");
              const config = {
                type: w.chartData.type || "bar",
                data: {
                  labels: w.chartData.labels || [],
                  datasets: (w.chartData.datasets || []).map((ds) => ({
                    ...ds,
                    borderColor: ds.backgroundColor,
                    borderWidth: 1,
                  })),
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: w.chartData.type === "pie" } },
                  scales: w.chartData.type === "pie" ? {} : { y: { beginAtZero: true } },
                },
              };
              new Chart(ctx, config);
            }
            if (w.tableData && w.tableData.headers && w.tableData.headers.length) {
              let tableHtml = "<table class=\"dashboard-widget-table\"><thead><tr>";
              w.tableData.headers.forEach((h) => { tableHtml += "<th>" + escapeHtml(String(h)) + "</th>"; });
              tableHtml += "</tr></thead><tbody>";
              (w.tableData.rows || []).slice(0, 15).forEach((row) => {
                tableHtml += "<tr>";
                row.forEach((cell) => { tableHtml += "<td>" + escapeHtml(String(cell)) + "</td>"; });
                tableHtml += "</tr>";
              });
              tableHtml += "</tbody></table>";
              if ((w.tableData.rows || []).length > 15) {
                tableHtml += "<p class=\"dashboard-widget-table-more\">" + (w.tableData.rows.length - 15) + " more rows — <a href=\"/report-view.html?id=" + w.id + "\" target=\"_blank\" rel=\"noopener\">Open full report</a></p>";
              }
              tableWrap.innerHTML = tableHtml;
              tableWrap.style.display = "block";
            }
            if (!w.chartData && tableWrap.innerHTML) {
              chartEl.style.display = "none";
              chartEl.style.height = "0";
            }
          }
          el.appendChild(div);
          const openLink = div.querySelector(".dashboard-widget-open");
          if (openLink) {
            openLink.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              window.open(openLink.getAttribute("href") || ("/report-view.html?id=" + w.id), "_blank", "noopener");
            });
          }
          div.querySelector(".dashboard-widget-remove").addEventListener("click", async (e) => {
            e.preventDefault();
            e.stopPropagation();
            const res = await fetch("/api/dashboard-widgets/" + w.id, { method: "DELETE", credentials: "include" });
            if (res.ok || res.status === 204) loadDashboardWidgets();
          });
          div.querySelector(".dashboard-widget-size").addEventListener("click", async () => {
            const next = { small: "medium", medium: "large", large: "small" }[size];
            const res = await fetch("/api/dashboard-widgets/" + w.id, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify({ size: next }),
            });
            if (res.ok) loadDashboardWidgets();
          });
        });
        renderBentoCards();
      } catch (_) {}
    }

    const BENTO_POS_KEY = "dashboardBentoPositions";
    const BENTO_ITEMS = [
      { id: "products", href: "/products.html", icon: "📦", title: "Products", desc: "View inventory, adjust quantities, scan barcodes", large: true },
      { id: "products-manage", href: "/products-manage.html", icon: "✏️", title: "Manage Products", desc: "Create, edit, and organize products", large: false },
      { id: "orders", href: "/orders.html", icon: "🛒", title: "Orders", desc: "View and manage orders", large: false },
      { id: "logs", href: "/logs.html", icon: "📋", title: "Transaction Log", desc: "Audit trail of inventory changes", large: false },
      { id: "users", href: "/users.html", icon: "👥", title: "Users", desc: "Manage accounts, permissions, and groups", large: false },
      { id: "groups", href: "/groups.html", icon: "🏷️", title: "Product Groups", desc: "Create groups and tag products", large: false },
      { id: "deployments", href: "/deployments.html", icon: "🏢", title: "Deployments", desc: "Manage companies – add and switch between deployments", large: false },
      { id: "reports", href: "/reports.html", icon: "📊", title: "Reports", desc: "AI-powered reports – ask anything", large: false },
    ];

    function getBentoPositions() {
      try {
        const s = localStorage.getItem(BENTO_POS_KEY);
        if (s) return JSON.parse(s);
      } catch (_) {}
      const out = {};
      BENTO_ITEMS.forEach((item, i) => {
        const col = i % 3;
        const row = Math.floor(i / 3);
        out[item.id] = { x: col * 320, y: row * 260 };
      });
      return out;
    }

    function setBentoPosition(id, x, y) {
      const pos = getBentoPositions();
      pos[id] = { x, y };
      localStorage.setItem(BENTO_POS_KEY, JSON.stringify(pos));
    }

    function renderBentoCards() {
      const layer = document.getElementById("bentoCardsLayer");
      if (!layer) return;
      layer.innerHTML = "";
      const positions = getBentoPositions();
      BENTO_ITEMS.forEach((item) => {
        const pos = positions[item.id] || { x: 0, y: 0 };
        const a = document.createElement("a");
        a.href = item.href;
        a.className = "bento-card board-item" + (item.large ? " bento-card-large" : "");
        a.dataset.bentoId = item.id;
        a.draggable = true;
        a.style.left = pos.x + "px";
        a.style.top = pos.y + "px";
        a.innerHTML = "<span class=\"bento-icon\">" + item.icon + "</span><h2>" + escapeHtml(item.title) + "</h2><p>" + escapeHtml(item.desc) + "</p>";
        layer.appendChild(a);
      });
      setupBoardDragDrop();
    }

    function handleBoardDrop(e) {
      e.preventDefault();
      const json = e.dataTransfer.getData("application/json");
      if (!json) return;
      let payload;
      try { payload = JSON.parse(json); } catch (_) { return; }
      const rect = BOARD.getBoundingClientRect();
      const boardX = e.clientX - rect.left + BOARD.scrollLeft;
      const boardY = e.clientY - rect.top + BOARD.scrollTop;
      const left = Math.max(0, boardX - (payload.offsetX ?? 0));
      const top = Math.max(0, boardY - (payload.offsetY ?? 0));
      if (payload.type === "widget") {
        const el = document.querySelector(".dashboard-widget[data-id=\"" + payload.id + "\"]");
        if (el) {
          el.style.left = left + "px";
          el.style.top = top + "px";
          fetch("/api/dashboard-widgets/" + payload.id, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ posX: Math.round(left), posY: Math.round(top) }),
          }).catch(() => {});
        }
      } else if (payload.type === "bento") {
        const el = document.querySelector(".bento-card[data-bento-id=\"" + payload.id + "\"]");
        if (el) {
          el.style.left = left + "px";
          el.style.top = top + "px";
          setBentoPosition(payload.id, Math.round(left), Math.round(top));
        }
      }
    }

    function setupBoardDragDrop() {
      if (!BOARD) return;
      [BOARD, document.getElementById("dashboardWidgets"), document.getElementById("bentoCardsLayer")].forEach((el) => {
        if (!el) return;
        el.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
        });
        el.addEventListener("drop", handleBoardDrop);
      });
      document.querySelectorAll(".dashboard-widget").forEach((widget) => {
        widget.addEventListener("dragstart", (e) => {
          if (e.target.closest("button") || e.target.closest("a")) { e.preventDefault(); return; }
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("application/json", JSON.stringify({
            type: "widget",
            id: widget.dataset.id,
            offsetX: e.clientX - widget.getBoundingClientRect().left,
            offsetY: e.clientY - widget.getBoundingClientRect().top,
          }));
          widget.classList.add("dashboard-widget-dragging");
        });
        widget.addEventListener("dragend", () => widget.classList.remove("dashboard-widget-dragging"));
        widget.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; });
        widget.addEventListener("drop", handleBoardDrop);
      });
      let bentoJustDragged = false;
      document.querySelectorAll(".bento-card").forEach((card) => {
        card.addEventListener("dragstart", (e) => {
          bentoJustDragged = true;
          const r = card.getBoundingClientRect();
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData("application/json", JSON.stringify({
            type: "bento",
            id: card.dataset.bentoId,
            offsetX: e.clientX - r.left,
            offsetY: e.clientY - r.top,
          }));
          card.classList.add("bento-card-dragging");
        });
        card.addEventListener("dragend", () => {
          card.classList.remove("bento-card-dragging");
          setTimeout(() => { bentoJustDragged = false; }, 100);
        });
        card.addEventListener("click", (e) => {
          if (bentoJustDragged) {
            e.preventDefault();
            bentoJustDragged = false;
          }
        });
        card.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; });
        card.addEventListener("drop", handleBoardDrop);
      });
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s ?? "";
      return d.innerHTML;
    }

    loadDashboardWidgets();
    renderBentoCards();
    setInterval(loadDashboardWidgets, 5 * 60 * 1000);
  </script>
</body>
</html>
