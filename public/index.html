<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="prefetch" href="/products-manage.html">
  <link rel="prefetch" href="/orders.html">
  <link rel="prefetch" href="/logs.html">
  <script src="/app-nav.js"></script>
</head>
<body>
  <div class="app-layout">
    <header class="top-nav">
      <span class="top-nav-brand">Inventory</span>
      <nav class="top-nav-tabs">
        <a href="/" class="active">Products</a>
        <a href="/products-manage.html">Manage Products</a>
        <a href="/orders.html">Orders</a>
        <a href="/logs.html">Transaction Log</a>
      </nav>
    </header>
    <main class="main-content">
  <div class="toolbar">
    <h1>Products</h1>
    <button type="button" class="btn-upload" id="btnAddInventory">Add inventory</button>
    <select id="groupFilter" title="Filter by user group">
      <option value="">All products</option>
    </select>
    <a href="/api/products/export/csv" class="btn-download" id="exportCsvLink" download="inventory.csv">Download CSV</a>
  </div>
  <div class="scanner-bar" id="scannerBar" style="display:none">
    <label>Scan barcode:</label>
    <input type="text" id="scanInput" placeholder="Focus here, then scan..." autocomplete="off">
    <label>Qty:</label>
    <select id="scanQty">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="5">5</option>
      <option value="10">10</option>
    </select>
    <div class="scan-mode">
      <button type="button" id="scanDeduct" class="active">Deduct</button>
      <button type="button" id="scanAdd" class="add">Add</button>
      <button type="button" id="scanReceive" class="receive">Receive</button>
    </div>
  </div>
  <div class="table-wrap">
    <div class="loading" id="status">Loading…</div>
    <table id="table" style="display:none">
      <thead>
        <tr>
          <th data-col="name">Name</th>
          <th data-col="sku">SKU</th>
          <th data-col="quantity" class="num">Quantity</th>
          <th data-col="price" class="num">Price</th>
          <th data-col="group">Group</th>
          <th class="actions-col">Actions</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  </main>
  </div>
  <div class="modal-overlay" id="addInventoryModal">
    <div class="modal" style="min-width: 360px;">
      <h3>Add inventory</h3>
      <p class="kit-modal-hint">Select a product to receive, or a kit to build. Building kits deducts the required quantities from each component.</p>
      <div class="modal-row">
        <label>Product or kit</label>
        <select id="addInventoryProduct">
          <option value="">Select...</option>
        </select>
      </div>
      <div class="modal-row" id="addInventoryKitPreview" style="display: none;">
        <label>Will deduct from components:</label>
        <div class="kit-preview-list" id="addInventoryKitPreviewList"></div>
      </div>
      <div class="modal-row">
        <label id="addInventoryQtyLabel">Quantity to receive</label>
        <input type="number" id="addInventoryQty" min="1" value="1" placeholder="1">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-apply" id="btnAddInventorySubmit">Receive</button>
        <button type="button" class="btn-cancel" id="btnAddInventoryCancel">Cancel</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modalTitle">Adjust inventory</h3>
      <div class="modal-row">
        <label>Deduct (subtract from current)</label>
        <input type="number" id="deductInput" min="1" placeholder="Amount to deduct">
      </div>
      <div class="modal-row">
        <label>Offline ship (deduct for offline order)</label>
        <div class="offline-ship-row">
          <input type="number" id="offlineShipQty" min="1" placeholder="Qty" style="width: 70px;">
          <input type="text" id="offlineShipName" placeholder="Customer / ordered by (required)" style="flex: 1;">
        </div>
      </div>
      <div class="modal-row" id="receiveRow">
        <label id="receiveLabel">Receive (add to current)</label>
        <input type="number" id="receiveInput" min="1" placeholder="Quantity received">
      </div>
      <div class="modal-row" id="kitBuildRow" style="display: none;">
        <label>Kit (build from components – deducts child inventory)</label>
        <input type="number" id="kitBuildInput" min="1" placeholder="Kits to build">
      </div>
      <div class="modal-row">
        <label>Hard count (set to exact quantity)</label>
        <input type="number" id="hardCountInput" min="0" placeholder="New quantity">
      </div>
      <div class="modal-actions">
        <button class="btn-apply" id="btnApply">Apply</button>
        <button class="btn-cancel" id="btnCancel">Cancel</button>
      </div>
    </div>
  </div>
  <script>
    let data = [];
    const status = document.getElementById("status");
    const table = document.getElementById("table");
    const body = document.getElementById("body");

    async function load() {
      try {
        const groupId = document.getElementById("groupFilter")?.value || "";
        const url = groupId ? `/api/products?groupId=${encodeURIComponent(groupId)}` : "/api/products";
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.statusText);
        data = await res.json();
        render(data);
        status.style.display = "none";
        table.style.display = "table";
        document.getElementById("scannerBar").style.display = "flex";
      } catch (e) {
        status.textContent = "Error: " + e.message;
        status.className = "error";
      }
    }

    async function loadGroups() {
      const res = await fetch("/api/user-groups");
      const groups = await res.json();
      const opts = '<option value="">All groups (global)</option>' + groups.map(g => `<option value="${g.id}">${escape(g.name)}</option>`).join("");
      const groupFilter = document.getElementById("groupFilter");
      const productGroup = document.getElementById("productGroup");
      if (groupFilter) {
        const current = groupFilter.value;
        groupFilter.innerHTML = '<option value="">All products</option>' + groups.map(g => `<option value="${g.id}">${g.name}</option>`).join("");
        if (current) groupFilter.value = current;
        updateExportLink();
      }
      if (productGroup) productGroup.innerHTML = opts;
    }

    function updateExportLink() {
      const groupId = document.getElementById("groupFilter")?.value || "";
      const link = document.getElementById("exportCsvLink");
      if (link) link.href = groupId ? `/api/products/export/csv?groupId=${groupId}` : "/api/products/export/csv";
    }

    function render(rows) {
      body.innerHTML = rows.map(p => `
        <tr data-id="${p.id}">
          <td>${escape(p.name)}${p.productType === "kit" ? ' <span class="badge badge-kit">Kit</span>' : ""}${p.productType === "kit" && p.kitItems?.length ? `<div class="kit-contents">Contains: ${(p.kitItems || []).map(i => `${i.quantity}× ${escape(i.product?.name || "?")}`).join(", ")}</div>` : ""}</td>
          <td>${escape(p.sku)}</td>
          <td class="num qty-cell ${p.productType === "kit" ? "" : p.quantity === 0 ? "qty-zero" : p.quantity <= 5 ? "qty-low" : ""}">${p.productType === "kit" ? (p.kitItems?.length ? p.quantity : "—") : p.quantity}</td>
          <td class="num">${formatPrice(p.price)}</td>
          <td>${p.group ? escape(p.group.name) : "—"}</td>
          <td class="actions-col">
            <button class="btn-adjust" data-id="${p.id}">Adjust</button>
            <a href="/api/products/${p.id}/label" class="btn-label" target="_blank" download>Print Label</a>
          </td>
        </tr>
      `).join("");
      body.querySelectorAll(".btn-adjust").forEach(btn => {
        btn.addEventListener("click", () => openModal(Number(btn.dataset.id)));
      });
    }

    let editingId = null;
    const modal = document.getElementById("modal");
    const deductInput = document.getElementById("deductInput");
    const receiveInput = document.getElementById("receiveInput");
    const hardCountInput = document.getElementById("hardCountInput");

    function openModal(id) {
      editingId = id;
      const p = data.find(x => x.id === id);
      if (!p) return;
      document.getElementById("modalTitle").textContent = `Adjust: ${p.name}${p.productType === "kit" ? " (kit – changes apply to components)" : ""}`;
      deductInput.value = "";
      receiveInput.value = "";
      hardCountInput.value = "";
      document.getElementById("offlineShipQty").value = "";
      document.getElementById("offlineShipName").value = "";
      document.getElementById("kitBuildInput").value = "";
      deductInput.placeholder = `Current: ${p.quantity}`;
      receiveInput.placeholder = `Current: ${p.quantity}`;
      hardCountInput.placeholder = `Current: ${p.quantity}`;
      document.getElementById("kitBuildInput").placeholder = `Current: ${p.quantity}`;
      const isKit = p.productType === "kit" && p.kitItems?.length;
      document.getElementById("receiveRow").style.display = isKit ? "none" : "block";
      document.getElementById("kitBuildRow").style.display = isKit ? "block" : "none";
      modal.classList.add("open");
      deductInput.focus();
    }

    function closeModal() {
      modal.classList.remove("open");
      editingId = null;
    }

    document.getElementById("btnCancel").addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
    });

    // Add inventory modal
    const addInventoryModal = document.getElementById("addInventoryModal");
    const addInventoryProduct = document.getElementById("addInventoryProduct");
    const addInventoryQty = document.getElementById("addInventoryQty");
    const addInventoryKitPreview = document.getElementById("addInventoryKitPreview");
    const addInventoryKitPreviewList = document.getElementById("addInventoryKitPreviewList");

    function populateAddInventoryDropdown() {
      const groupId = document.getElementById("groupFilter")?.value || "";
      const filtered = groupId ? data.filter(p => !p.groupId || p.groupId == groupId) : data;
      const regular = filtered.filter(p => (p.productType || "regular") !== "kit");
      const kits = filtered.filter(p => p.productType === "kit" && p.kitItems?.length);
      let html = '<option value="">Select...</option>';
      if (regular.length) {
        html += '<optgroup label="Products">' + regular.map(p => `<option value="${p.id}">${escape(p.name)} (${p.sku})</option>`).join("") + "</optgroup>";
      }
      if (kits.length) {
        html += '<optgroup label="Kits">' + kits.map(p => `<option value="${p.id}" data-kit="1">${escape(p.name)} (${p.sku}) – Kit</option>`).join("") + "</optgroup>";
      }
      addInventoryProduct.innerHTML = html;
      addInventoryKitPreview.style.display = "none";
    }

    function updateAddInventoryKitPreview() {
      const opt = addInventoryProduct.selectedOptions[0];
      const isKit = opt?.dataset?.kit;
      const id = addInventoryProduct.value;
      const qty = Math.max(1, parseInt(addInventoryQty.value, 10) || 1);
      if (!id || !isKit) {
        addInventoryKitPreview.style.display = "none";
        return;
      }
      const p = data.find(x => x.id == id);
      if (!p?.kitItems?.length) {
        addInventoryKitPreview.style.display = "none";
        return;
      }
      addInventoryKitPreview.style.display = "block";
      addInventoryKitPreviewList.innerHTML = (p.kitItems || []).map(i => `${i.quantity * qty}× ${escape(i.product?.name || "?")}`).join(", ");
    }
    addInventoryProduct.addEventListener("change", () => {
      updateAddInventoryKitPreview();
      const opt = addInventoryProduct.selectedOptions[0];
      const isKit = opt?.dataset?.kit;
      document.getElementById("addInventoryQtyLabel").textContent = isKit ? "Kits to build" : "Quantity to receive";
      document.getElementById("btnAddInventorySubmit").textContent = isKit ? "Build" : "Receive";
    });
    addInventoryQty.addEventListener("input", updateAddInventoryKitPreview);

    document.getElementById("btnAddInventory").addEventListener("click", () => {
      populateAddInventoryDropdown();
      addInventoryQty.value = "1";
      document.getElementById("addInventoryQtyLabel").textContent = "Quantity to receive";
      document.getElementById("btnAddInventorySubmit").textContent = "Receive";
      addInventoryModal.classList.add("open");
    });

    document.getElementById("btnAddInventorySubmit").addEventListener("click", async () => {
      const productId = addInventoryProduct.value;
      const qty = Math.max(1, parseInt(addInventoryQty.value, 10) || 1);
      if (!productId) {
        alert("Select a product or kit.");
        return;
      }
      try {
        const res = await fetch(`/api/products/${productId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ adjust: qty, source: "receive" }),
        });
        if (!res.ok) throw new Error((await res.json()).message || res.statusText);
        await load();
        addInventoryModal.classList.remove("open");
      } catch (e) {
        alert("Error: " + e.message);
      }
    });

    document.getElementById("btnAddInventoryCancel").addEventListener("click", () => addInventoryModal.classList.remove("open"));
    addInventoryModal.addEventListener("click", (e) => { if (e.target === addInventoryModal) addInventoryModal.classList.remove("open"); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && addInventoryModal.classList.contains("open")) addInventoryModal.classList.remove("open");
    });

    document.getElementById("groupFilter")?.addEventListener("change", () => { load(); updateExportLink(); });

    document.getElementById("btnApply").addEventListener("click", async () => {
      const deduct = deductInput.value.trim();
      const offlineShipQty = document.getElementById("offlineShipQty").value.trim();
      const offlineShipName = document.getElementById("offlineShipName").value.trim();
      const receive = receiveInput.value.trim();
      const kitBuild = document.getElementById("kitBuildInput").value.trim();
      const hardCount = hardCountInput.value.trim();
      const p = data.find(x => x.id === editingId);
      const isKit = p?.productType === "kit" && p?.kitItems?.length;
      const filled = [deduct, (offlineShipQty && offlineShipName), (isKit ? kitBuild : receive), hardCount].filter(Boolean);
      if (filled.length === 0) return;
      if (filled.length > 1) {
        alert("Use only one option: Deduct, Offline ship, " + (isKit ? "Kit" : "Receive") + ", or Hard count.");
        return;
      }
      if (offlineShipQty && !offlineShipName) {
        alert("Customer / ordered by name is required for offline ship.");
        return;
      }
      if (offlineShipName && !offlineShipQty) {
        alert("Enter quantity for offline ship.");
        return;
      }
      let payload;
      if (deduct) payload = { adjust: -Math.abs(Number(deduct)) };
      else if (offlineShipQty && offlineShipName) payload = { adjust: -Math.abs(Number(offlineShipQty)), source: `offline_ship: ${offlineShipName.trim()}` };
      else if (isKit && kitBuild) payload = { adjust: Math.abs(Number(kitBuild)), source: "receive" };
      else if (receive) payload = { adjust: Math.abs(Number(receive)), source: "receive" };
      else payload = { quantity: Math.max(0, Number(hardCount)) };
      try {
        const res = await fetch(`/api/products/${editingId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error((await res.json()).message || res.statusText);
        const p = data.find(x => x.id === editingId);
        const isKit = p?.productType === "kit" && p?.kitItems?.length;
        if (isKit) await load();
        else {
          const updated = await res.json();
          const idx = data.findIndex(x => x.id === editingId);
          if (idx >= 0) data[idx] = { ...data[idx], ...updated };
          render(data);
        }
        closeModal();
      } catch (e) {
        alert("Error: " + e.message);
      }
    });

    function escape(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    function formatPrice(n) {
      return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    document.querySelectorAll("th[data-col]").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.dataset.col;
        const asc = th.dataset.dir !== "asc";
        th.dataset.dir = asc ? "asc" : "desc";
        const mult = asc ? 1 : -1;
        data.sort((a, b) => {
          const va = col === "group" ? (a.group?.name || "") : a[col];
          const vb = col === "group" ? (b.group?.name || "") : b[col];
          if (typeof va === "number" && typeof vb === "number") return mult * (va - vb);
          return mult * String(va || "").localeCompare(String(vb || ""));
        });
        render(data);
      });
    });

    const scanInput = document.getElementById("scanInput");
    const scanQty = document.getElementById("scanQty");
    const scanDeduct = document.getElementById("scanDeduct");
    const scanAdd = document.getElementById("scanAdd");
    const scanReceive = document.getElementById("scanReceive");
    let scanMode = "deduct";

    scanDeduct.addEventListener("click", () => { scanMode = "deduct"; scanDeduct.classList.add("active"); scanAdd.classList.remove("active"); scanReceive.classList.remove("active"); });
    scanAdd.addEventListener("click", () => { scanMode = "add"; scanAdd.classList.add("active", "add"); scanDeduct.classList.remove("active"); scanReceive.classList.remove("active"); });
    scanReceive.addEventListener("click", () => { scanMode = "receive"; scanReceive.classList.add("active", "receive"); scanDeduct.classList.remove("active"); scanAdd.classList.remove("active"); });

    scanInput.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const sku = scanInput.value.trim();
      scanInput.value = "";
      if (!sku) return;
      const p = data.find(x => x.sku.toUpperCase() === sku.toUpperCase());
      if (!p) {
        alert("Product not found: " + sku);
        return;
      }
      const qty = Math.abs(Number(scanQty.value) || 1);
      const adjust = scanMode === "deduct" ? -qty : qty;
      const source = scanMode === "receive" ? "receive" : "scan";
      try {
        const res = await fetch(`/api/products/${p.id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ adjust, source }),
        });
        if (!res.ok) throw new Error((await res.json()).message || res.statusText);
        const updated = await res.json();
        const idx = data.findIndex(x => x.id === p.id);
        if (idx >= 0) data[idx] = { ...data[idx], ...updated };
        render(data);
      } catch (err) {
        alert("Error: " + err.message);
      }
    });

    loadGroups().then(load);
  </script>
</body>
</html>
