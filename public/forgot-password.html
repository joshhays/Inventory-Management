<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Inventory</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSIzNiIgdmlld0JveD0iMCAwIDgwIDM2Ij48cmVjdCB3aWR0aD0iODAiIGhlaWdodD0iMzYiIGZpbGw9IiNmMWY1ZjkiIHJ4PSI2Ii8+PHRleHQgeD0iNDAiIHk9IjIyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNjQ3NDhiIiBmb250LXNpemU9IjEyIiBmb250LWZhbWlseT0ic3lzdGVtLXVpLHNhbnMtc2VyaWYiPkludmVudG9yeTwvdGV4dD48L3N2Zz4=" alt="Inventory" class="nav-logo"></div>
      <h1 class="login-title">Reset password</h1>
      <p class="login-subtitle">Enter your email to receive a reset link</p>
      <p class="login-store-link"><a href="/login.html">← Back to sign in</a></p>
      <form id="forgotForm" class="login-form">
        <div class="login-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div id="forgotError" class="login-error" style="display:none"></div>
        <div id="forgotSuccess" class="login-success" style="display:none"></div>
        <button type="submit" class="login-btn" id="forgotBtn">Send reset link</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById("forgotForm");
    const emailInput = document.getElementById("email");
    const errorEl = document.getElementById("forgotError");
    const successEl = document.getElementById("forgotSuccess");
    const btn = document.getElementById("forgotBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      successEl.style.display = "none";
      errorEl.textContent = "";
      successEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Sending…";

      try {
        const res = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailInput.value.trim() }),
          credentials: "include",
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          throw new Error(data.message || "Request failed. Please try again.");
        }

        successEl.textContent = data.message || "If an account exists, you'll receive a reset link by email.";
        successEl.style.display = "block";
        btn.textContent = "Send reset link";
      } catch (err) {
        errorEl.textContent = err.message || "Something went wrong.";
        errorEl.style.display = "block";
        btn.textContent = "Send reset link";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
