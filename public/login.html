<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Inventory</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSIzNiIgdmlld0JveD0iMCAwIDgwIDM2Ij48cmVjdCB3aWR0aD0iODAiIGhlaWdodD0iMzYiIGZpbGw9IiNmMWY1ZjkiIHJ4PSI2Ii8+PHRleHQgeD0iNDAiIHk9IjIyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNjQ3NDhiIiBmb250LXNpemU9IjEyIiBmb250LWZhbWlseT0ic3lzdGVtLXVpLHNhbnMtc2VyaWYiPkludmVudG9yeTwvdGV4dD48L3N2Zz4=" alt="Inventory" class="nav-logo"></div>
      <h1 class="login-title">Inventory</h1>
      <p class="login-subtitle">Admin sign in</p>
      <p class="login-store-link"><a href="/store/">← Customer store</a></p>
      <form id="loginForm" class="login-form">
        <div class="login-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
          <p class="login-forgot"><a href="/forgot-password.html">Forgot password?</a></p>
        </div>
        <div id="loginError" class="login-error" style="display:none"></div>
        <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const errorEl = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      errorEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Signing in…";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: emailInput.value.trim(),
            password: passwordInput.value,
          }),
          credentials: "include",
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          const msg = data.message || (res.status === 500 ? "Server error. Check the terminal for details." : "Login failed.");
          throw new Error(msg);
        }

        if (data.user && !data.user.isAdmin) {
          throw new Error("Admin access required. Use the customer store to sign in.");
        }

        window.location.href = "/dashboard.html";
      } catch (err) {
        errorEl.textContent = err.message || "Login failed. Please try again.";
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
