# Railway deployment config
# https://docs.railway.app/reference/config-as-code

[build]
builder = "nixpacks"
buildCommand = "npm install --omit=optional && npx prisma generate && npm run build"

[deploy]
# No-op so pre-deploy succeeds; actual migration runs in container ENTRYPOINT
preDeployCommand = "true"
startCommand = "prisma migrate deploy && node src/server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
