# Nixpacks config for Railway
# Python + build-essential needed for node-gyp (canvas, better-sqlite3 native modules)
# Use npm install instead of npm ci (avoids lockfile sync failures)

[phases.setup]
aptPkgs = ["...", "python3", "build-essential"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]
